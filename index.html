--bg:#15161c;--panel:#1f2029;--line:#2f3140;--text:#ecebf3;--muted:#a9a7bb;--ok:#5fcf90;--accent:#FFC233;--warn:#ff9a4d;--bad:#ff6b6f;--chip:#34301f;
--on-accent:#1b1606;--sel:#3a3218;--hover:#ffffff14;--shadow:#0007;--btn:#262833;--btn-line:#4a4d60;--btn-h:#323546;
--side:#1b1c24;--side-text:#ecebf3;--side-muted:#a9a7bb;--side-line:#2f3140;--side-hover:#2a2c38;--logo-bg:#ffffff;

--p1:rgba(255,160,60,.18);--p2:rgba(140,130,255,.2);--p3:rgba(80,200,140,.18);--p4:rgba(255,110,160,.18);--p5:rgba(255,194,51,.2);--p6:rgba(90,160,255,.2);--ic:#ecebf3;--tile:#222430;--sheet-i:#272a37;

*{box-sizing:border-box}
/* thanh cuộn mảnh, gần như trong suốt; rõ hơn khi rê chuột */
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text) 18%,transparent) transparent}
*:hover{scrollbar-color:color-mix(in srgb,var(--text) 35%,transparent) transparent}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 18%,transparent);border-radius:6px}
:hover::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 35%,transparent)}

html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45}

label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted);font-weight:500}

.inl{display:flex;gap:6px}

.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:13px;background:var(--chip);color:var(--muted)}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--ok);color:var(--on-ok);padding:10px 20px;border-radius:var(--r-nut);box-shadow:0 3px 10px var(--shadow);font-size:16px;font-weight:500}
.toast.err{background:var(--bad);color:var(--on-bad)}
dialog{border:1px solid var(--line);border-radius:var(--r-the);padding:18px;max-width:min(980px,96vw);width:100%;box-shadow:0 8px 40px var(--shadow);background:var(--panel);color:var(--text)}

.mbtn{background:var(--btn);color:var(--text);border:1px solid var(--btn-line);border-radius:var(--r-nut);padding:8px 12px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
.mbtn:hover{background:var(--btn-h)}
.theme-btn{width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;background:var(--side-hover);color:var(--side-text);border:1px solid var(--side-line);cursor:pointer;flex:none}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---- Desktop shell kiểu console HOAVU + biểu đồ ---- */
:root,:root[data-theme="light"]{--side-active:#FFE9A0;--c1:#FFD43B;--c2:#F2A33A;--c3:#8E84E8;--c4:#3FB985;--c5:#F27FA5;--c6:#6BA8F0}
:root[data-theme="dark"]{--side-active:#3a3218;--c1:#FFC233;--c2:#ff9f45;--c3:#9f97f5;--c4:#5fcf90;--c5:#ff8fb3;--c6:#7db4ff}
.brand{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:2px 6px 2px 2px;border-radius:var(--r-nut)}
.brand:hover{background:var(--side-hover)}
.shell{display:block}
#nav{display:flex;gap:4px;padding:4px 8px;overflow-x:auto;position:sticky;top:0;z-index:20;background:var(--side);box-shadow:0 2px 6px var(--shadow);border-bottom:1px solid var(--side-line)}
#nav .nv-top,#nav .nv-gh{display:none}
#nav .nv-grp,#nav .nv-items{display:contents}
#nav .nv-it{display:flex;align-items:center;flex:none;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;border-radius:8px;color:var(--side-text);padding:10px 14px;font-size:15px;cursor:pointer;min-height:46px}
#nav .nv-it svg{display:none}
#nav .nv-it:hover{background:var(--side-hover)}
#nav .nv-it.on{background:var(--sel);color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.pghead{display:none}
.pgsec{display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);margin:2px 0 12px;font-weight:500}
.pgsec::after{content:"";flex:1;border-top:1px solid var(--line)}
body.easy .pgsec{display:none}
.row2>*{min-width:0}.row2 .eb{padding-left:4px;padding-right:4px}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pk .key{min-height:60px;font-family:var(--font);font-size:28px;font-weight:700;border-radius:var(--r-nut);border:1px solid var(--btn-line);background:var(--btn);color:var(--text);cursor:pointer}
.pk .key:active{background:var(--sel)}
#dlg .tw{max-height:46vh}
#stmtBody{overflow-x:auto}
#stmtBody .tw table{min-width:560px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.card-h h2{margin:0}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(590px,100%),1fr));gap:14px}
.chbox{min-width:0;border:1px solid var(--line);border-radius:var(--r-nut);padding:10px;background:var(--panel)}
.chh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chs{overflow-x:auto;max-width:100%}.chs svg{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 4px}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chnote{font-size:12px;color:var(--muted);margin-top:4px}
.chdet{margin-top:10px}
.ct{fill:var(--muted);font-size:12px;font-family:var(--font)}.cv{fill:var(--text);font-size:12px;font-weight:600;font-family:var(--font)}.cg{stroke:var(--line);stroke-width:1}
.bar-sel{fill:none;stroke:var(--accent);stroke-width:2}
.segm{display:flex;gap:4px;flex-wrap:wrap}.segm button{padding:4px 10px;font-size:13px;border-radius:var(--r-nut);border:1px solid var(--btn-line);background:var(--btn);color:var(--text);cursor:pointer;min-height:34px;font-family:var(--font)}.segm button:hover{background:var(--btn-h)}.segm button.on{background:var(--sel);border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
@media(min-width:900px){
 body:not(.easy) header{position:sticky;top:0;z-index:40;height:52px;padding:0 20px;flex-wrap:nowrap;background:color-mix(in srgb,var(--side) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--side-shadow)}
 body:not(.easy) .bt small{display:none}
 body:not(.easy) .bt b{font-size:17px}
 body:not(.easy) .logo img{width:34px;height:34px}
 body:not(.easy) .pill2,body:not(.easy) .mbtn,body:not(.easy) .theme-btn{min-height:38px;height:38px;padding-top:0;padding-bottom:0}
 body:not(.easy) .theme-btn{width:38px;padding:0}
 body:not(.easy) .shell{display:flex;align-items:flex-start}
 body:not(.easy) main{flex:1;min-width:0;max-width:1500px;margin:0;padding:20px 26px 60px}
 body:not(.easy) #nav{display:block;width:240px;flex:none;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;overflow-x:hidden;padding:10px 8px;border-bottom:0;border-right:1px solid var(--side-line);box-shadow:var(--side-shadow)}
 body:not(.easy) #nav .nv-top{display:block;margin-bottom:4px}
 body:not(.easy) #nav .nv-collapse{background:none;border:0;color:var(--side-muted);font-size:14px;cursor:pointer;padding:6px 8px;border-radius:8px;min-height:36px;font-family:var(--font)}
 body:not(.easy) #nav .nv-collapse:hover{background:var(--side-hover);color:var(--side-text)}
 body:not(.easy) #nav .nv-grp{display:block}
 body:not(.easy) #nav .nv-items{display:block}
 body:not(.easy) #nav .nv-gh{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:var(--side-muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 10px 4px;cursor:pointer;font-weight:600;font-family:var(--font)}
 body:not(.easy) #nav .nv-gh span{transition:transform .15s}
 body:not(.easy) #nav .nv-grp.closed .nv-items{display:none}
 body:not(.easy) #nav .nv-grp.closed .nv-gh span{transform:rotate(-90deg)}
 body:not(.easy) #nav .nv-it{display:flex;width:100%;border-bottom:0;border-left:3px solid transparent;padding:9px 10px;min-height:42px;text-align:left;gap:10px}

 body:not(.easy) #nav .nv-it.on{background:var(--side-active);color:var(--side-text);border-left-color:var(--accent)}
 body.nv-min:not(.easy) #nav{width:56px;padding:10px 6px}
 body.nv-min:not(.easy) #nav .lb,body.nv-min:not(.easy) #nav .nv-gh span{display:none}
 body.nv-min:not(.easy) #nav .nv-gh{font-size:0;padding:0;margin:8px 0 4px;border-top:1px solid var(--side-line);height:0}
 body.nv-min:not(.easy) #nav .nv-grp.closed .nv-items{display:block}
 body.nv-min:not(.easy) #nav .nv-it{justify-content:center;padding:9px 0;border-left-width:3px}
 body:not(.easy) .pghead{display:flex;align-items:center;gap:16px;margin-bottom:14px}
 .pghead .logo.big{background:var(--logo-bg);border:1px solid var(--line);border-radius:16px;padding:4px;display:grid;place-items:center}
 .pghead .logo.big img{width:72px;height:72px}
 .pghead h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:.03em}
 .pgsub{color:var(--muted);font-size:15px}
 .pgr{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
}
#gate{display:none}
body.gated header,body.gated .shell{display:none!important}
body.gated #gate{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg,#fff);overflow:auto;align-items:flex-start;justify-content:center;padding:20px 16px}
#gate .gbox{width:100%;max-width:460px;margin:auto;text-align:center}
#gate .ehero{margin-bottom:6px}#gate h1{font-size:22px;margin:6px 0 10px}#gate p{font-size:17px;margin:8px 0;color:var(--text)}
#gate .gerr{color:var(--bad,#b3261e);font-weight:700;font-size:17px;margin:6px 0;min-height:1px}
#gate .glinks{display:flex;flex-direction:column;gap:12px;margin-top:14px;font-size:16px}#gate .glinks a{color:var(--text);text-decoration:underline;cursor:pointer}
#gate input{width:100%;box-sizing:border-box;text-align:center}
.bellbtn{position:relative;background:transparent;border:1px solid var(--side-line);color:var(--side-text);border-radius:8px;padding:4px 9px;font-size:18px;cursor:pointer;line-height:1.2}
.bellbtn .bn{position:absolute;top:-7px;right:-7px;background:#d32f2f;color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
#gSearch{width:210px;max-width:30vw;padding:6px 10px;border-radius:8px;border:1px solid var(--side-line);background:rgba(255,255,255,.12);color:var(--side-text);font-size:14px}
#gSearch::placeholder{color:var(--side-muted)}
body.easy #gSearch{display:none}
#gsPanel{position:fixed;top:56px;left:16px;width:min(580px,calc(100vw - 32px));max-height:72vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px var(--shadow);z-index:80;padding:8px}
.gsh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 4px 4px}
.gsr{display:block;width:100%;text-align:left;font-family:var(--font);font-size:15px;color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;margin:2px 0;cursor:pointer}
.gsr small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.gsr:hover,.gsr.on{background:var(--sel);border-color:var(--accent)}
#eGsRes .gsr{border:1px solid var(--line);background:var(--panel);font-size:18px;padding:12px;margin:6px 0}
#eGsRes .gsr small{font-size:15px}
.nfi{border:1px solid var(--line);border-left:6px solid var(--muted);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.nfi.s0{border-left-color:#d32f2f}.nfi.s1{border-left-color:#f59e0b}.nfi.s2{border-left-color:#2563eb}
.nfi .nft{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.nfi .nfb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tile{position:relative}.tbadge{position:absolute;top:8px;right:10px;background:#d32f2f;color:#fff;border-radius:12px;font-style:normal;font-size:14px;font-weight:700;min-width:24px;height:24px;line-height:24px;text-align:center;padding:0 6px}

/* ================= Giao diện B: vàng bơ + ô pastel (chỉ đổi hình thức) ================= */
body{-webkit-tap-highlight-color:transparent}
input:focus,select:focus,textarea:focus{outline:3px solid var(--ring);outline-offset:0;border-color:var(--yel)}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input,select,textarea{border-radius:14px;border:1.5px solid var(--btn-line)}
.card,.ecard,.kpi,.chbox{border:0;box-shadow:var(--sh)}
.card{border-radius:20px}
.chbox{border-radius:16px;box-shadow:0 2px 10px var(--shadow)}
.btn{border:0;border-radius:14px;background:var(--btn);box-shadow:0 2px 8px var(--shadow);font-weight:600}
.btn:hover{background:var(--btn-h)}
.btn-p{background:var(--accent);color:var(--on-accent);box-shadow:none}
.btn-d{border:0;background:var(--panel);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.seg button,.segm button{border:0;border-radius:12px;box-shadow:0 1px 6px var(--shadow)}
.seg button.on,.segm button.on{background:var(--sel);box-shadow:inset 0 0 0 2px var(--yel);font-weight:700;color:var(--text)}
.chip{border:0;background:var(--chip)}
.sumbox{border:0;border-radius:16px}
.wbox{border:2px dashed var(--yel);border-radius:16px}
.warn{border:0;border-left:5px solid var(--warn);border-radius:16px}
.tw{border:1px solid var(--line);border-radius:16px;overflow:auto}
th{background:var(--chip);color:var(--muted);font-weight:600}
tbody tr:nth-child(even) td{background:var(--zebra)}
tr:hover td{background:var(--hover)!important}
tr.foot td{background:var(--row-sum)!important}
th,td{border-bottom:1px solid var(--line)}
.toast{background:var(--accent);color:var(--on-accent);border-radius:14px;box-shadow:var(--sh);font-weight:600}
.toast.err{background:var(--bad);color:var(--on-bad)}
dialog{border:0;border-radius:22px;box-shadow:0 12px 44px rgba(31,35,64,.28)}
.link{color:var(--text);font-weight:600}
.pill{background:var(--chip);color:var(--text)}
/* chip trạng thái đồng bộ */
.pill2{background:rgba(111,108,130,.16);color:var(--muted);font-size:15px;font-weight:700;padding:8px 14px;min-height:40px;border-radius:24px}
.pill2.ok{background:rgba(255,194,51,.26);color:var(--chip-ok)}
.pill2.wait{background:rgba(240,130,30,.18);color:var(--chip-wait)}
.pill2.bad{background:rgba(198,40,40,.14);color:var(--chip-bad)}
.pill2.off,.pill2.none{background:rgba(111,108,130,.16);color:var(--muted)}
/* header */
header{background:var(--side);border-bottom:0;box-shadow:0 2px 14px rgba(201,162,32,.10)}
.logo{border:0;box-shadow:0 2px 8px var(--shadow);border-radius:12px;background:var(--logo-bg)}
.mbtn{border:0;border-radius:24px;background:var(--btn);box-shadow:0 2px 8px var(--shadow)}
.theme-btn{border:0;background:var(--btn);box-shadow:0 2px 8px var(--shadow);color:var(--text)}
.bellbtn{border:0;border-radius:50%;width:42px;height:42px;padding:0;background:var(--btn);box-shadow:0 2px 8px var(--shadow);color:var(--text);display:grid;place-items:center}
#gSearch{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;box-shadow:inset 0 1px 3px rgba(201,162,32,.12)}
#gSearch::placeholder{color:var(--muted)}
#gsPanel{border:0;border-radius:16px;box-shadow:0 12px 36px rgba(31,35,64,.22)}
.gsr:hover,.gsr.on{background:var(--sel);border-color:transparent}
#eGsRes .gsr{border:0;box-shadow:var(--sh);border-radius:16px}
/* thanh trên cùng khi chưa vào trang chủ dễ dùng */
body.easy header{padding:8px 12px}
body.easy.ehome header{display:none}
body.easy #syncPill{font-size:14px;min-height:44px;padding:6px 12px}
/* ---- sidebar / menu (chế độ đầy đủ) ---- */
#nav{background:var(--side);border-bottom:0;box-shadow:0 2px 10px rgba(201,162,32,.10)}
#nav .nv-it{border-bottom:0;border-radius:12px;color:var(--side-muted);font-weight:500}
#nav .nv-it:hover{background:var(--side-hover);color:var(--text)}
#nav .nv-it.on{background:var(--sel);color:var(--text);border-bottom:0;font-weight:700}
@media(min-width:900px){
 body:not(.easy) header{background:var(--side);-webkit-backdrop-filter:none;backdrop-filter:none}
 body:not(.easy) #nav{border-right:0;box-shadow:var(--side-shadow)}
 body:not(.easy) #nav .nv-it{border-left:0;border-radius:12px}

/* ---- KPI pastel ---- */
.kpi{position:relative;overflow:hidden;border-left:0!important;border-radius:18px;background:var(--p2);box-shadow:none;padding:14px 16px}
.kpis>.kpi:nth-child(6n+1){background:var(--hero)}
.kpis>.kpi:nth-child(6n+2){background:var(--p1)}
.kpis>.kpi:nth-child(6n+3){background:var(--p2)}
.kpis>.kpi:nth-child(6n+4){background:var(--p3)}
.kpis>.kpi:nth-child(6n+5){background:var(--p4)}
.kpis>.kpi:nth-child(6n+6){background:var(--p6)}
.kpis>.kpi:first-child::before{content:'';position:absolute;right:-34px;top:-34px;width:104px;height:104px;border-radius:50%;background:var(--hero-c);pointer-events:none}
.kpi>*{position:relative}
.kpi .t{color:var(--muted);font-weight:600;font-size:14px}
.kpi .v{color:var(--text);font-weight:800}
.kpi.red .t::before,.kpi.green .t::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--bad)}
.kpi.green .t::before{background:var(--ok)}
.kpi ul{margin-top:6px}
.kpi li{align-items:baseline;gap:14px;padding:3px 0;border-bottom:1px dashed rgba(111,108,130,.25)}
.kpi li:last-child{border-bottom:0}
.kpi li>span{flex:1;min-width:0}
.kpi li>b{flex:none;white-space:nowrap;text-align:right}
@media(min-width:700px){.kpis>.kpi:has(>ul){grid-column:span 2}}
/* ---- biểu đồ ---- */
.cg{stroke:var(--line)}
.bar-sel{stroke:var(--chl)}
.legend i{border-radius:4px}
.bar{background:var(--chip)}.bar i{background:var(--yel)}
/* ================= CHẾ ĐỘ DỄ DÙNG ================= */
body.easy{background:var(--bg)}
body.easy main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.easy:not(.hasnav) main{padding-bottom:24px}
.eb{border:0;border-radius:18px;background:var(--panel);box-shadow:var(--sh);color:var(--text)}

.eb.go,.eb.ok{background:var(--accent);color:var(--on-accent)}

.einput{border-radius:14px;border:1.5px solid var(--btn-line);background:var(--panel)}
.ecard{border-radius:20px}
.kpd{border:2px solid var(--yel);border-radius:18px;background:var(--chip);box-shadow:none}
.key,.pk .key{border:0;border-radius:16px;background:var(--panel);box-shadow:0 3px 10px var(--shadow);color:var(--text)}

.pbar .eb{box-shadow:none}
/* trang chủ */
.ehm-top{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.ehm-logo{width:48px;height:48px;border-radius:14px;background:var(--logo-bg);box-shadow:var(--sh);display:grid;place-items:center;flex:none}

.ehm-hi{flex:1;min-width:0}.ehm-hi b{display:block;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ibtn{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--sh);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none;font-size:20px;padding:0}

svg.ico0,.ibtn svg,.tile svg,#bnav svg,.eal svg,.ic2 svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.ehm-row .schip::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:8px;opacity:.9}
.ehero2{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-t);border-radius:22px;padding:18px 18px 16px;box-shadow:0 10px 26px rgba(230,180,30,.22)}
.ehero2::before{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--hero-c)}

function catGroup(c){c=catCanon(c);return CHI_PROC.includes(c)?'proc':CHI_GEN.includes(c)?'gen':CHI_OTH.includes(c)?'non':THU_CATS.includes(c)?'thu':'gen';}
const DRY_ID='qua_kho';
const METHODS=[['phoi','Phơi sân','☀️'],['lo','Đốt lò','🔥'],['cahai','Cả hai','♻️']];

const SENS_COLLS=['purchases','exchanges','beanPayments','sales','adjustments','cash','stockIns','advances','deposits','cashCounts','openings','stocktakes'];
const ARR_KEYS=['types','customers','purchases','exchanges','beanPayments','sales','adjustments','cash','stockIns','stocktakes','openings','advances','deposits','cashCounts','auditLog'];

function normalizeDB(o){const d=defaults();const r=Object.assign({},d,o);const os=o.settings||{};
 r.settings=Object.assign({},d.settings,os);
 {const nm=String(r.settings.shopName==null?'':r.settings.shopName).replace(/\s+/g,' ').trim();if(!nm||nm==='Đại lý thu mua cà phê'){r.settings.shopName='Lý Thuỷ';if(os.shopName!==undefined&&os.shopName!=='Lý Thuỷ'){r.settings.updatedAt=new Date().toISOString();normalizeDB.migrated=true;}}}r.settings.seq=Object.assign({},d.settings.seq,os.seq||{});r.settings.openingStock=Object.assign({},os.openingStock||{});
 for(const k of ARR_KEYS){if(!Array.isArray(r[k]))r[k]=d[k];}
 if(!Array.isArray(r.deleted))r.deleted=[];
 if(!r.types.length)r.types=d.types;r.version=1;return r;}
let DB,cache=null;
/* ===== Store: the ONLY module that touches localStorage. A later step can swap it for a server backend. ===== */
const Store={
 USERKEY:'soSachCaPhe_v1_nguoiNhap',snap:{},
 getUser(){const w=Store.srvName&&Store.srvName();if(w)return w;try{return localStorage.getItem(Store.USERKEY)||'';}catch(e){return'';}},
 setUser(n){try{localStorage.setItem(Store.USERKEY,n);}catch(e){}},
 load(){let st,s;try{s=localStorage.getItem(KEY);}catch(e){st=defaults();Store.rebase(st);setTimeout(()=>toast('Trình duyệt đang chặn bộ nhớ: dữ liệu sẽ KHÔNG được lưu. Hãy mở bằng Chrome/Edge bình thường (không ẩn danh).','err'),300);return st;}
  Store.raw=s;
  try{st=s?normalizeDB(JSON.parse(s)):defaults();}
  catch(e){try{localStorage.setItem(KEY+'_loi',localStorage.getItem(KEY));}catch(_){}st=defaults();setTimeout(()=>toast('Dữ liệu cũ bị lỗi, đã bắt đầu sổ mới (bản lỗi được giữ lại trong trình duyệt).','err'),300);}
  Store.rebase(st);return st;},
 key(r){const c=Object.assign({},r);delete c.createdAt;delete c.updatedAt;delete c.createdBy;delete c.updatedBy;return JSON.stringify(c);},
 skey(st){return JSON.stringify(Object.assign({},st.settings,{lastBackup:0,updatedAt:0,custCodesDone:0,owedToDepositDone:0}));}, /* cờ nội bộ không tính là "sửa cài đặt" */
 off(){try{return Number(Store.sy().off)||0;}catch(e){return 0;}}, /* độ lệch đồng hồ máy so với máy chủ (ms) */
 nowIso(){return new Date(Date.now()+Store.off()).toISOString();},
 later(prev,now){if(prev&&prev>=now){const t=Date.parse(prev);if(t)return new Date(t+1).toISOString();}return now;}, /* dấu thời gian luôn lớn hơn bản đã thấy, kể cả khi đồng hồ máy lệch */
 rebase(st){Store.snapSet=Store.skey(st);Store.snap={};Store.ts={};for(const k of ARR_KEYS)(st[k]||[]).forEach(r=>{Store.snap[k+':'+r.id]=Store.key(r);Store.ts[k+':'+r.id]=r.updatedAt||'';});},
 stamp(st){const now=Store.nowIso(),by=Store.getUser()||'';if(!Store.ts)Store.ts={};const sk=Store.skey(st);if(Store.snapSet===undefined)Store.snapSet=sk;else if(sk!==Store.snapSet){st.settings.updatedAt=Store.later(st.settings.updatedAt,now);Store.snapSet=sk;}const alive={};if(!Array.isArray(st.deleted))st.deleted=[];if(Store.audit&&st.auditLog)Store.audit(st,now,by);
  for(const k of ARR_KEYS)st[k].forEach(r=>{if(!r.id)r.id=uid();const key=k+':'+r.id;alive[key]=1;const old=Store.snap[key];
   if(!r.createdAt){r.createdAt=now;r.createdBy=r.createdBy||by;r.updatedAt=now;}
   else if(old===undefined){r.updatedAt=now;}else if(old!==Store.key(r))r.updatedAt=Store.later(r.updatedAt,now);if(!r.updatedAt)r.updatedAt=r.createdAt;
   Store.snap[key]=Store.key(r);Store.ts[key]=r.updatedAt;});
  for(const key in Store.snap)if(!alive[key]){const i=key.indexOf(':');st.deleted.push({coll:key.slice(0,i),id:key.slice(i+1),at:Store.later(Store.ts[key],now),by});delete Store.snap[key];delete Store.ts[key];}},
 wipeUndo(){try{const s=localStorage.getItem('soCaPheWipeUndo');return s?JSON.parse(s):null;}catch(e){return null;}},
 setWipeUndo(v){try{if(v)localStorage.setItem('soCaPheWipeUndo',JSON.stringify(v));else localStorage.removeItem('soCaPheWipeUndo');return true;}catch(e){return false;}},
 save(st){Store.stamp(st);try{const cur=localStorage.getItem(KEY);if(Store.raw!==undefined&&(cur||null)!==(Store.raw||null)){Store.tabReload();return false;} /* tab khác đã ghi dữ liệu mới hơn: KHÔNG ghi đè bằng bộ nhớ cũ */
   const js=JSON.stringify(st);localStorage.setItem(KEY,js);Store.raw=js;Store.dirtyMem=false;return true;}catch(e){return false;}},

let LOCK_OFF=0;

  for(const r of DB[k]||[]){const key=k+':'+r.id;seen[key]=1;const old=Store.snap[key];if(old===Store.key(r))continue;let od='';if(old!==undefined){try{od=JSON.parse(old).date||'';}catch(e){}}if(inL(r.date)||inL(od))return L;}

/* số liệu bất thường (gõ thừa số 0): hỏi lại chứ không chặn */
function unusualOk(kg,price,amt){const m=[];if(kg>100000)m.push('khối lượng '+fkg(kg)+' (hơn 100.000 kg)');if(price>1000000)m.push('đơn giá '+money(price)+'/kg (hơn 1.000.000 đ/kg)');if(amt>1e10)m.push('số tiền '+money(amt)+' (hơn 10 tỷ đồng)');
 if(!m.length)return true;try{return confirm('Số liệu có vẻ bất thường: '+m.join('; ')+'.\n\nBạn có chắc đã gõ đúng không? Bấm OK để vẫn lưu, Hủy để sửa lại.');}catch(e){return true;}}
/* trả nợ / thu nợ nhiều hơn số đang nợ: hỏi lại (phần dư làm công nợ âm) */
function overpayOk(amount,before,dir){if(!(amount>before+0.5))return true;try{return confirm((dir==='chi'?'Số trả ':'Số thu ')+money(amount)+' lớn hơn số đang nợ '+money(before)+' (dư '+money(amount-before)+').\n\nPhần dư sẽ làm công nợ của khách thành số âm. Bấm OK để vẫn lưu, Hủy để sửa lại.');}catch(e){return true;}}
/* phiếu ghi ngày ở tương lai: hỏi lại; không lấy ngày tương lai làm ngày mặc định cho phiếu sau */
function futureOk(d){if(!(d>today()))return true;try{return confirm('Ngày '+fmtDate(d)+' ở TƯƠNG LAI (hôm nay là '+fmtDate(today())+').\n\nBạn có chắc đã chọn đúng ngày không? Bấm OK để vẫn lưu, Hủy để sửa lại.');}catch(e){return true;}}
function setLastDate(d){if(d>today())return;ui.lastDate=d;ui.lastDay=today();}
function dfltDate(){const t=today();return ui.lastDate&&ui.lastDay===t?ui.lastDate:t;}
const fmtDate=iso=>iso&&/^\d{4}-\d\d-\d\d/.test(iso)?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):(iso||'');
const trim=s=>String(s==null?'':s).replace(/\s+/g,' ').trim();
const normName=s=>trim(s).normalize('NFC').toLowerCase();
const fold=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function pNum(s){if(s==null)return NaN;s=String(s).replace(/\s/g,'');if(s==='')return NaN;
 if(s.indexOf(',')>=0){if((s.match(/,/g)||[]).length>1)return NaN;s=s.replace(/\./g,'').replace(',','.');}
 else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
 if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;return Number(s);}
const MONEY_MSG='Số tiền không có số lẻ, chỉ gõ số đồng, ví dụ 1.500.000';
function pMoney(s){s=String(s==null?'':s).replace(/\s/g,'');if(s===''||s==='-')return 0;
 if(/^-?\d+$/.test(s))return parseInt(s,10);if(/^-?\d{1,3}(\.\d{3})+$/.test(s))return parseInt(s.replace(/\./g,''),10);return NaN;}
function moneyBad(root){let bad=null;$$('.money',root||document).forEach(i=>{const bd=i.value.trim()!==''&&isNaN(pMoney(i.value));i.style.borderColor=bd?'var(--bad)':'';if(bd&&!bad)bad=i;});
 if(bad){bad.focus();fail(MONEY_MSG);return true;}return false;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
let tsLast=0;function nextTs(){tsLast=Math.max(Date.now(),tsLast+1);return tsLast;}
function nextCode(p,dt){const d=/^\d{4}-/.test(dt||'')?dt:today();const k=p+d.slice(2,4);const s=DB.settings.seq;s[k]=(s[k]||0)+1;return k+'-'+pad(s[k],4);}
function cmpDate(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);}
function cmpDateDesc(a,b){return -cmpDate(a,b);}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),err?5000:2500);}
const fail=m=>{toast(m,true);return false;};

/* ===== weighing & calc (pure) ===== */
const tareTotalOf=r=>r.tareTotal!=null?r.tareTotal:r2((r.tare||0)*((r.bags||[]).length));
const grossOf=r=>r.gross!=null?r.gross:r2((r.kg!=null?r.kg:(r.kgFresh||0))+tareTotalOf(r));
const TT=p=>p==='mua'||p==='ban'||p==='doi'||p==='nk'||p==='kgi';
function weigh(bags,tare){const n=bags.length;const tot=r2(bags.reduce((a,b)=>a+b,0));const tb=r2(n*(tare||0));return{n,tot,tb,net:r2(tot-tb)};}
function parseBags(text){const bags=[],bad=[];String(text||'').split(/[\s;]+/).forEach(t=>{if(!t)return;const v=pNum(t);if(isFinite(v)&&v>0)bags.push(v);else bad.push(t);});return{bags,bad};}
function calcBean(fresh,ratio){return ratio>0?r2(fresh/ratio):0;}
function calcAmount(kg,price){return Math.round(Math.round((kg||0)*100)*(price||0)/100);}

const custById=id=>DB.customers.find(c=>c.id===id);
const custLabel=c=>c?((c.code?c.code+' – ':'')+c.name):'(đã xóa)';
const custName=id=>custLabel(custById(id));
const custSub=c=>[c.address,c.phone].filter(Boolean).join(' · ');
const codeWords=n=>fold(trim(n)).toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().split(' ').filter(Boolean);
const givenOf=n=>{const w=codeWords(n);return w.length?w[w.length-1]:'';};
const codeNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function codeTaken(code,exceptId){const u=String(code).toUpperCase();return DB.customers.some(c=>c.id!==exceptId&&c.code&&String(c.code).toUpperCase()===u);}
function genCode(name,exceptId){const w=codeWords(name);if(!w.length)return'';const cand=[w[w.length-1]];if(w.length>=3)cand.push(w.slice(1).join('-'));if(w.length>=2)cand.push(w.join('-'));
 for(const c of cand)if(!codeTaken(c,exceptId))return c;const base=cand[cand.length-1];for(let n=2;;n++){const c=base+'-'+n;if(!codeTaken(c,exceptId))return c;}}
const typeName=id=>{const t=DB.types.find(t=>t.id===id);return t?t.name:'(không rõ)';};
function findCust(txt){const t=trim(txt);if(!t)return null;const m=t.match(/^([A-Za-z0-9-]+) – /);
 if(m){const u=m[1].toUpperCase();const c=DB.customers.find(c=>c.code&&String(c.code).toUpperCase()===u);if(c){const rest=normName(t.slice(m[0].length));if(!rest||rest===normName(c.name))return c;}}
 const n=normName(t);const c=DB.customers.find(c=>normName(c.name)===n);if(c)return c;
 const k=codeNorm(t);return k?(DB.customers.find(c=>c.code&&codeNorm(c.code)===k)||null):null;}
function custNeedFull(name){if(codeWords(name).length<2&&DB.customers.some(c=>givenOf(c.name)===givenOf(name)))return'Đã có khách tên "'+trim(name)+'". Hãy chọn đúng người trong danh sách, hoặc gõ ĐỦ HỌ TÊN (ví dụ "Trần Văn Hoa") để tạo khách mới.';return'';}
function newCust(o){const c=Object.assign({id:uid(),name:'',phone:'',address:'',group:'Khác',note:''},o);c.name=trim(c.name);c.code=genCode(c.name);DB.customers.push(c);refreshCustList();return c;}
function ensureCust(name,group){let c=findCust(name);if(!c){{const m=trim(name).match(/^([A-Za-z0-9-]+) – /);const o=m&&DB.customers.find(x=>x.code&&String(x.code).toUpperCase()===m[1].toUpperCase());if(o)throw new Error('"'+m[1]+'" là mã của khách "'+o.name+'". Nếu đúng khách này, hãy chọn trong danh sách gợi ý. Nếu là người khác, hãy bỏ phần "'+m[1]+' – " và gõ lại tên.');}const e=custNeedFull(name);if(e)throw new Error(e);c=newCust({name,group:group||'Khác'});}return c;}
function refreshCustList(){$('#dlCust').innerHTML=DB.customers.slice().sort((a,b)=>a.name.localeCompare(b.name,'vi')).map(c=>'<option value="'+esc(custLabel(c))+'" label="'+esc(custSub(c))+'">').join('');}

const depOrphanSet=db=>{const ex=new Set((db.exchanges||[]).map(x=>x.id));return d=>d.kind!=='out'&&d.source==='exchange'&&!!d.exchangeId&&!ex.has(d.exchangeId);};
function stats(){if(cache)return cache;
 const S={cust:{},stock:{},cash:0,thu:0,chi:0,debtBuy:0,debtSale:0,bean:0,adv:0,dep:{},overBuy:0,overSale:0,overAdv:0};
 const C=id=>S.cust[id]||(S.cust[id]={buy:0,buyPaid:0,buyKg:0,buyN:0,payLater:0,sale:0,salePaid:0,saleN:0,recvLater:0,beanDue:0,beanPaid:0,fresh:0,exN:0,advDed:0,advIn:0,advRepaid:0,opSup:0,opCus:0,dep:{}});
 (DB.openings||[]).forEach(o=>{if(!o.customerId)return;const c=C(o.customerId);if(o.kind==='supplierDebt')c.opSup+=Number(o.amount)||0;else if(o.kind==='customerDebt')c.opCus+=Number(o.amount)||0;else if(o.kind==='beanOwed')c.beanDue+=Number(o.kg)||0;else if(o.kind==='advance')c.advIn+=Number(o.amount)||0;else if(o.kind==='deposit'){const t=o.typeId||DB.settings.beanTypeId;c.dep[t]=(c.dep[t]||0)+(Number(o.kg)||0);}});
 (DB.advances||[]).forEach(a=>{C(a.customerId).advIn+=Number(a.amount)||0;});
 const isOrph=depOrphanSet(DB);
 (DB.deposits||[]).forEach(a=>{if(isOrph(a))return;const c=C(a.customerId);c.dep[a.typeId]=(c.dep[a.typeId]||0)+(a.kind==='out'?-1:1)*(Number(a.kg)||0);});
 S.stock[DB.settings.beanTypeId]=beanBook(DB);
 DB.purchases.forEach(p=>{const c=C(p.customerId);c.buy+=p.amount;c.buyPaid+=p.paid;c.buyKg+=p.kg;c.buyN++;c.advDed+=Number(p.advanceDeduct)||0;if(p.depositSettle)c.dep[p.typeId]=(c.dep[p.typeId]||0)-p.kg;});
 DB.sales.forEach(p=>{const c=C(p.customerId);c.sale+=p.amount;c.salePaid+=p.paid;c.saleN++;});
 DB.exchanges.forEach(x=>{const c=C(x.customerId);c.beanDue+=x.kgBean;c.fresh+=x.kgFresh;c.exN++;});
 DB.beanPayments.forEach(b=>{C(b.customerId).beanPaid+=b.kg;});
 DB.cash.forEach(e=>{if(e.dir==='thu')S.thu+=e.amount;else S.chi+=e.amount;
  if(e.customerId&&e.dir==='thu'&&e.cat===CAT_THUUNG)C(e.customerId).advRepaid+=e.amount;
  if(!e.phieuId&&e.customerId){const c=C(e.customerId);if(e.dir==='chi'&&(e.cat===CAT_NO||e.cat===CAT_MUA))c.payLater+=e.amount;if(e.dir==='thu'&&e.cat===CAT_THUNO)c.recvLater+=e.amount;}});
 S.cash=openCash(DB)+S.thu-S.chi;
 {const LO=legacyOwedMap(DB),bid0=DB.settings.beanTypeId;for(const id in LO)if(LO[id]>0){const c=C(id);c.owedLeg=LO[id];c.dep[bid0]=(c.dep[bid0]||0)+LO[id];}}
 for(const id in S.cust){const c=S.cust[id];c.debtBuy=c.buy-c.buyPaid-c.advDed-c.payLater+c.opSup;c.debtSale=c.sale-c.salePaid-c.recvLater+c.opCus;c.owedLeg=c.owedLeg||0;c.beanLeft=0;c.advLeft=c.advIn-c.advDed-c.advRepaid;c.depKg=0;for(const t in c.dep){c.dep[t]=r2(c.dep[t]);c.depKg+=c.dep[t];S.dep[t]=r2((S.dep[t]||0)+c.dep[t]);}c.depKg=r2(c.depKg);
  if(c.debtBuy>0)S.debtBuy+=c.debtBuy;if(c.debtSale>0)S.debtSale+=c.debtSale;if(c.beanLeft>0)S.bean+=c.beanLeft;if(c.advLeft>0)S.adv+=c.advLeft;
  if(c.debtBuy<0)S.overBuy-=c.debtBuy;if(c.debtSale<0)S.overSale-=c.debtSale;if(c.advLeft<0)S.overAdv-=c.advLeft;}
 return cache=S;}
const overLine=(n,lbl)=>Math.round(n)>0?'<div class="t" style="color:var(--bad);margin-top:2px">'+lbl+': '+money(n)+'</div>':'';
const cs=id=>stats().cust[id]||{owedLeg:0,advLeft:0,depKg:0,dep:{},debtBuy:0,debtSale:0,beanLeft:0,buy:0,buyPaid:0,buyKg:0,buyN:0,sale:0,salePaid:0,saleN:0,beanDue:0,beanPaid:0,fresh:0,exN:0};

/* ===== linked cash sync ===== */
function addCash(o){DB.cash.push(Object.assign({id:uid(),ts:nextTs(),note:'',customerId:'',phieuId:'',phieuKind:''},o));}
const removeLinked=id=>{DB.cash=DB.cash.filter(e=>e.phieuId!==id);};
/* dòng quỹ LIÊN KẾT với phiếu: id cố định 'lc-'+id phiếu → sửa phiếu là sửa tại chỗ (không xóa/tạo lại), 2 máy cùng sửa vẫn ra đúng 1 dòng */
const lcId=sid=>'lc-'+sid;
function linkedSpec(kind,p){
 if(kind==='mua')return p.paid>0?{date:p.date,dir:'chi',cat:CAT_MUA,amount:p.paid,customerId:p.customerId,note:'Trả tiền '+p.code,phieuId:p.id,phieuKind:'mua'}:null;
 if(kind==='ban')return p.paid>0?{date:p.date,dir:'thu',cat:CAT_BAN,amount:p.paid,customerId:p.customerId,note:'Thu tiền '+p.code,phieuId:p.id,phieuKind:'ban'}:null;
 return(p.mode==='cash'&&p.amount>0)?{date:p.date,dir:'chi',cat:CAT_NHAN,amount:p.amount,customerId:p.customerId,note:'Quy '+fkg(p.kg)+' nhân ra tiền '+(p.code||''),phieuId:p.id,phieuKind:'tn'}:null;}
function setLinked(sid,o){const id=lcId(sid);const mine=DB.cash.filter(e=>e.phieuId===sid);let row=mine.find(e=>e.id===id)||null;
 if(mine.length>(row?1:0))DB.cash=DB.cash.filter(e=>e.phieuId!==sid||e===row);
 if(!o){if(row)DB.cash=DB.cash.filter(e=>e!==row);return;}
 if(row)Object.assign(row,o);else{DB.deleted=DB.deleted.filter(d=>!(d.coll==='cash'&&d.id===id));addCash(Object.assign({id:id},o));}}
function syncTrade(k,p){setLinked(p.id,linkedSpec(k,p));}
function syncBean(b){setLinked(b.id,linkedSpec('tn',b));}
/* tự làm cho dòng quỹ liên kết KHỚP với phiếu gốc (chỉ máy chủ/chủ): đúng 1 dòng = số đã trả khi >0, không dòng nào khi 0, xóa dòng mồ côi. Dòng id ngẫu nhiên của bản cũ nếu đã đúng thì để nguyên (tự đổi sang id cố định khi phiếu được sửa hoặc khi lệch).
   Chỉ đụng vào phiếu + dòng quỹ ĐÃ gửi xong lên máy chủ (không giành với bản đang chờ gửi). */
function reconcileLinkedCash(){if(!DB||isStaff()||Store.busy||!Store.has()||Store.pending())return 0;
 const sy=Store.sy(),ok=(k,r)=>!!r.updatedAt&&sy.pushed[k+':'+r.id]===r.updatedAt;let n=0;
 const by={};DB.cash.forEach(e=>{if(e.phieuId)(by[e.phieuId]=by[e.phieuId]||[]).push(e);});
 const KC={mua:'purchases',ban:'sales',tn:'beanPayments'},known=new Set();
 for(const kind in KC){const coll=KC[kind];
  for(const s of DB[coll].slice()){known.add(s.id);if(!ok(coll,s))continue;const rows=by[s.id]||[];if(rows.some(e=>!ok('cash',e)))continue;
   const want=linkedSpec(kind,s);
   if(!want){if(rows.length){setLinked(s.id,null);n++;}continue;}
   const r0=rows[0];if(rows.length===1&&r0.amount===want.amount&&r0.dir===want.dir&&r0.cat===want.cat&&r0.date===want.date&&(r0.customerId||'')===(want.customerId||''))continue;
   setLinked(s.id,want);n++;}}
 for(const e of DB.cash.slice()){if(!e.phieuId||!KC[e.phieuKind]||known.has(e.phieuId)||!ok('cash',e))continue;
  DB.cash=DB.cash.filter(x=>x!==e);n++;}
 if(n)cache=null;return n;}
/* phiếu đổi mới → tự tạo phiếu ký gửi LIÊN KẾT (cùng ngày, cùng người tạo); phiếu đổi cũ chưa có ký gửi liên kết vẫn theo đường cũ (trả nhân ngay) */
const exDeposit=id=>DB.deposits.find(d=>d.exchangeId===id&&d.source==='exchange');
function syncExchange(x,isNew){let dp=exDeposit(x.id);
 if(dp||isNew){const bid=DB.settings.beanTypeId;if(!dp){dp={id:uid(),code:nextCode('KG',x.date),ts:nextTs(),kind:'in',source:'exchange',exchangeId:x.id,bags:[]};DB.deposits.push(dp);}
  Object.assign(dp,{date:x.date,customerId:x.customerId,typeId:bid,kg:x.kgBean,gross:x.kgBean,tareTotal:0,note:'Từ phiếu đổi '+x.code});return;}
 let b=DB.beanPayments.find(b=>b.exchangeId===x.id);
 if(x.paidNow>0){if(!b){b={id:uid(),code:'',exchangeId:x.id,ts:nextTs()};DB.beanPayments.push(b);}Object.assign(b,{date:x.date,customerId:x.customerId,kg:x.paidNow,mode:'bean',price:0,amount:0,note:'Trả ngay khi đổi '+x.code});}
 else if(b){removeLinked(b.id);DB.beanPayments=DB.beanPayments.filter(z=>z!==b);}}

const M=n=>({n:Math.round(n||0)+0,txt:fnum(n)});
const K=n=>({n:r2(n),txt:nfK.format(r2(n))});
const I=n=>({n:Math.round(n||0),txt:String(Math.round(n||0))});
const P=n=>({n:Number(n)||0,txt:nfP.format(Number(n)||0)});
const H=h=>({h:h});
function cellTD(v,cls){if(v&&typeof v==='object'){if(v.h!==undefined)return'<td>'+v.h+'</td>';return'<td class="num '+(v.n<0?'neg':'')+'">'+v.txt+'</td>';}return'<td'+(cls?' class="'+cls+'"':'')+'>'+esc(v)+'</td>';}
function renderTable(spec){const{cols,rows,foot,foot2}=spec;if(!rows.length)return'<p class="empty">Chưa có dữ liệu.</p>';
 let h='<div class="tw"><table><thead><tr>'+cols.map(c=>'<th class="'+(c.num?'num':'')+'">'+esc(c.h)+'</th>').join('')+'</tr></thead><tbody>';
 for(const r of rows)h+='<tr>'+cols.map(c=>cellTD(c.f(r),c.c)).join('')+'</tr>';
 if(foot)h+='<tr class="foot">'+foot.map(v=>cellTD(v)).join('')+'</tr>';
 if(foot2)h+='<tr class="foot">'+foot2.map(v=>cellTD(v)).join('')+'</tr>';
 return h+'</tbody></table></div>';}
function exportXls(file,spec){const secs=(spec.sections||[spec]).filter(s=>s.cols);let body='';
 for(const s of secs){const cols=s.cols.map((c,i)=>({c,i})).filter(o=>o.c.x!==false);
  body+='<table border="1">';if(s.title)body+='<tr><th colspan="'+cols.length+'" style="font-size:14pt">'+esc(s.title)+'</th></tr>';
  body+='<tr>'+cols.map(o=>'<th style="background:#e9e4dc">'+esc(o.c.h)+'</th>').join('')+'</tr>';
  const cell=v=>{if(v&&typeof v==='object'){if(v.h!==undefined)return'<td></td>';return'<td x:num="'+v.n+'">'+v.n+'</td>';}return'<td style="mso-number-format:\'\\@\'">'+esc(v)+'</td>';};
  for(const r of s.rows)body+='<tr>'+cols.map(o=>cell(o.c.f(r))).join('')+'</tr>';
  if(s.foot)body+='<tr>'+cols.map(o=>{const v=s.foot[o.i];return'<td'+(v&&typeof v==='object'?' x:num="'+v.n+'"':'')+' style="font-weight:bold">'+(v&&typeof v==='object'?v.n:esc(v))+'</td>';}).join('')+'</tr>';
  if(s.foot2)body+='<tr>'+cols.map(o=>{const v=s.foot2[o.i];return'<td'+(v&&typeof v==='object'?' x:num="'+v.n+'"':'')+' style="font-weight:bold">'+(v&&typeof v==='object'?v.n:esc(v))+'</td>';}).join('')+'</tr>';
  body+='</table><br>';}
 const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Sheet1</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+body+'</body></html>';
 download(file+'-'+today()+'.xls','\ufeff'+html,'application/vnd.ms-excel;charset=utf-8');}
function download(name,text,type){const b=new Blob([text],{type:type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

let POV=null;
function closePrint(silent){if(!POV)return;const p=POV;POV=null;p.ov.remove();document.body.classList.remove('po');document.title=p.oldTitle;if(!silent&&p.onClose)p.onClose();}
let LASTRC=null,DRY=false,DRYOUT=null;
function printDoc(title,body,onClose){const model=LASTRC;LASTRC=null;if(DRY){DRYOUT=model;return;}closePrint(true);const ov=document.createElement('div');ov.id='printOv';

function weighHTML(p,label){return'<div class="wbox"><b>'+(label||'Cân hàng')+'</b> <small>– cân từng bao rồi gõ số, hoặc bỏ trống và nhập thẳng tổng KL cả bì. Trừ bì luôn được trừ ở bước cuối.</small>'

 +'<div><label>Gõ số cân từng bao rồi bấm Enter / "Thêm bao"<div class="inl"><input id="'+p+'-one" inputmode="decimal" enterkeyhint="done" placeholder="Số cân 1 bao"><button type="button" class="btn btn-p" data-act="addBag" data-p="'+p+'">+ Thêm bao</button><button type="button" class="btn" data-act="popBag" data-p="'+p+'">Xóa bao cuối</button></div></label>'
 +'<label style="margin-top:8px">Danh sách số cân (kg) – có thể gõ trực tiếp, cách nhau bằng dấu cách hoặc xuống dòng<textarea id="'+p+'-bags" inputmode="decimal" rows="3" placeholder="Ví dụ: 68 68 67,5 66 72"></textarea></label></div></div>'
 +'<div class="chips" id="'+p+'-sum"></div>'
 +'<label style="max-width:320px">'+(TT(p)?'Tổng KL cả bì nhập tay (kg) – khi không cân từng bao':'KL tịnh nhập tay (kg) – khi không cân từng bao')+'<input id="'+p+'-kg" inputmode="decimal" placeholder="0"></label></div>';}

ACT.addBag=b=>{const p=b.dataset.p,one=$('#'+p+'-one');const v=pNum(one.value);if(!(v>0)){if(one.value.trim()!=='')fail('Số cân không hợp lệ.');one.focus();return;}
 const ta=$('#'+p+'-bags');ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+one.value.trim();one.value='';bagsChanged(p);one.focus();};
ACT.popBag=b=>{const p=b.dataset.p,ta=$('#'+p+'-bags');const t=ta.value.trim().split(/[\s;]+/).filter(Boolean);t.pop();ta.value=t.join(' ');bagsChanged(p);};

function readW(p){const ts=getV(p+'-tare').trim();const tare=ts===''?0:pNum(ts);const pb=parseBags(getV(p+'-bags'));const man=pNum(getV(p+'-kg'));let w;
 if(TT(p)){const has=pb.bags.length>0;const gross=has?r2(pb.bags.reduce((a,b)=>a+b,0)):(isFinite(man)?r2(man):0);const tt=isFinite(tare)&&tare>0?r2(tare):0;
  w={n:pb.bags.length,tot:gross,tb:tt,net:r2(gross-tt)};
  return Object.assign(w,{tare:tare,tareTotal:tt,gross:gross,bags:pb.bags,bad:pb.bad,manualBad:getV(p+'-kg').trim()!==''&&!isFinite(man)});}
 if(pb.bags.length)w=weigh(pb.bags,tare);else w={n:0,tot:0,tb:0,net:isFinite(man)?r2(man):0};
 return Object.assign(w,{tare:tare,bags:pb.bags,bad:pb.bad,manualBad:getV(p+'-kg').trim()!==''&&!isFinite(man)});}
function updW(p){const w=readW(p);const kg=document.getElementById(p+'-kg');kg.disabled=w.bags.length>0;if(w.bags.length)kg.value='';
 $('#'+p+'-sum').innerHTML=(w.bags.length||(TT(p)&&w.tot>0)?'<span class="chip">Số bao: <b>'+w.n+'</b></span><span class="chip">Tổng cả bì: <b>'+fkg(w.tot)+'</b></span><span class="chip">Trừ bì: <b>'+fkg(w.tb)+'</b></span>':'')
  +'<span class="chip">KL tịnh: <b>'+fkg(w.net)+'</b></span>'+(w.bad.length?'<span class="chip" style="border-color:var(--bad);color:var(--bad)">Số không hợp lệ: '+esc(w.bad.join(', '))+'</span>':'');
 return w;}
function resetW(p){setV(p+'-tare',TT(p)?'':nfK.format(DB.settings.defaultTare));setV(p+'-bags','');setV(p+'-kg','');}
function fillW(p,r){if(TT(p)){const tt=tareTotalOf(r);setV(p+'-tare',tt?nfK.format(tt):'');}else setV(p+'-tare',nfK.format(r.tare==null?DB.settings.defaultTare:r.tare));setV(p+'-bags',(r.bags||[]).join(' '));setV(p+'-kg',(r.bags&&r.bags.length)?'':(TT(p)?(r.gross!=null?r.gross:r2((r.kg||0)+tareTotalOf(r))):r.kg));}
function checkW(w,what){if(w.bad.length)return fail('Có số cân không hợp lệ: '+w.bad.join(', ')+'. Chỉ nhập số lớn hơn 0.');
 if(w.manualBad)return fail('KL nhập tay không hợp lệ.');
 if(!isFinite(w.tare)||w.tare<0)return fail('Bì phải là số không âm.');
 if((w.bags.length||w.tareTotal>0)&&w.net<=0)return fail('Tổng cân nhỏ hơn hoặc bằng phần bì, kiểm tra lại số cân và phần trừ bì.');
 if(!(w.net>0))return fail('Vui lòng nhập số cân từng bao hoặc KL tịnh ('+what+') lớn hơn 0.');return true;}

 const s=cs(c.id);const p=[];if(s.debtBuy>0)p.push('ta nợ khách '+money(s.debtBuy));if(s.debtSale>0)p.push('khách nợ ta '+money(s.debtSale));if(s.advLeft>0.5)p.push('nợ ứng '+money(s.advLeft));if(s.depKg>0.004)p.push('ký gửi '+fkg(s.depKg)+' nhân');h.textContent=p.length?'Hiện: '+p.join(' · '):'Không có công nợ.';}

function tradeForm(k){const c=T[k];return'<div class="card"><h2 id="'+k+'-title"></h2><form id="f-'+k+'" data-live autocomplete="off"><div class="grid">'

  {h:'Số bao',num:1,f:r=>I(r.bags.length)},{h:'KL tịnh (kg)',num:1,f:r=>K(r.kg)},{h:'Đơn giá (đ/kg)',num:1,f:r=>M(r.price)},{h:'Thành tiền (đ)',num:1,f:r=>M(r.amount)},{h:c.paidCol+' (đ)',num:1,f:r=>M(r.paid)},{h:'Trừ ứng (đ)',num:1,f:r=>M(r.advanceDeduct||0)},{h:(k==='mua'?'Còn nợ':'Còn thiếu')+' (đ)',num:1,f:r=>M(r.amount-r.paid-(r.advanceDeduct||0))},{h:'Ghi chú',f:r=>r.note},
  {h:'',x:false,c:'act',f:r=>H('<button class="btn btn-s" data-act="edit" data-k="'+k+'" data-id="'+r.id+'">Sửa</button><button class="btn btn-s" data-act="print" data-k="'+k+'" data-id="'+r.id+'">In phiếu</button><button class="btn btn-s btn-d" data-act="del" data-k="'+k+'" data-id="'+r.id+'">Xóa</button>')}],
  foot:['Tổng cộng ('+rows.length+' phiếu)','','','',I(sum(r=>r.bags.length)),K(sum(r=>r.kg)),'',M(sum(r=>r.amount)),M(sum(r=>r.paid)),M(sum(r=>r.advanceDeduct||0)),M(sum(r=>r.amount-r.paid-(r.advanceDeduct||0))),'','']};}

function resetTrade(k){const tid=k==='mua'?DB.settings.freshTypeId:DB.settings.beanTypeId;setV(k+'-date',dfltDate());setV(k+'-cust','');setV(k+'-type',tid);setV(k+'-price',mfmt(lastPrice(k,tid)));setV(k+'-paid','');setV(k+'-note','');resetW(k);
 if(k==='mua'){setV('mua-adv','');const d=document.getElementById('mua-dep');if(d)d.checked=false;const pf=ui.preMua;ui.preMua=null;if(pf){setV('mua-cust',pf.name);setV('mua-type',pf.typeId);setV('mua-kg',pf.kg);setV('mua-price',mfmt(lastPrice('mua',pf.typeId)));d.checked=true;}}$('#'+k+'-title').textContent=T[k].head+' mới';$('#'+k+'-cancel').style.display='none';LIVE['f-'+k]();}
function fillTrade(k,r){setV(k+'-date',r.date);setV(k+'-cust',custName(r.customerId));setV(k+'-type',r.typeId);setV(k+'-price',mfmt(r.price));setV(k+'-paid',mfmt(r.paid));setV(k+'-note',r.note);fillW(k,r);if(k==='mua'){setV('mua-adv',mfmt(r.advanceDeduct));document.getElementById('mua-dep').checked=!!r.depositSettle;}
 $('#'+k+'-title').textContent='Sửa '+T[k].head.toLowerCase()+' '+r.code;$('#'+k+'-cancel').style.display='';LIVE['f-'+k]();}
function lastPrice(k,typeId){const l=DB[T[k].arr].filter(r=>r.typeId===typeId).sort(cmpDateDesc)[0];return l?l.price:0;}
function afterTrade(k){return()=>{const id=ui.edit[k];const r=id&&findRec(T[k].arr,id);if(r)fillTrade(k,r);else resetTrade(k);};}
AFTER.mua=afterTrade('mua');
function liveTrade(k){return t=>{const w=updW(k);if(t&&t.id===k+'-type'&&!pMoney(getV(k+'-price')))setV(k+'-price',mfmt(lastPrice(k,getV(k+'-type'))));
 const amt=calcAmount(w.net,pMoney(getV(k+'-price')));const adv=k==='mua'?pMoney(getV('mua-adv')):0;$('#'+k+'-amt').textContent=money(amt);$('#'+k+'-debt').textContent=money(amt-adv-pMoney(getV(k+'-paid')));custHint(k+'-cust',k+'-hint');if(k==='mua')muaHints();};}
LIVE['f-mua']=liveTrade('mua');LIVE['f-ban']=liveTrade('ban');
ACT.payFull=b=>{const k=b.dataset.k;const w=readW(k);setV(k+'-paid',mfmt(Math.max(0,calcAmount(w.net,pMoney(getV(k+'-price')))-(k==='mua'?pMoney(getV('mua-adv')):0))));LIVE['f-'+k]();};
function advLeftFor(custId,exceptPurchaseId){if(!custId)return 0;const o=exceptPurchaseId?findRec('purchases',exceptPurchaseId):null;return cs(custId).advLeft+(o&&o.customerId===custId?(Number(o.advanceDeduct)||0):0);}
function muaHints(){const c=findCust(getV('mua-cust'));const h=document.getElementById('mua-advhint'),h2=document.getElementById('mua-dephint');if(!h)return;
 const left=c?advLeftFor(c.id,ui.edit.mua):0;h.textContent=c?(left>0?'Đang nợ ứng: '+money(left):'Không nợ ứng.'):'';
 const dep=c?cs(c.id).dep:{};const t=getV('mua-type');h2.textContent=c&&dep[t]>0?'Khách đang ký gửi '+fkg(dep[t])+' '+typeName(t)+'.':'';}
ACT.advFill=()=>{const w=readW('mua');const c=findCust(getV('mua-cust'));const left=c?advLeftFor(c.id,ui.edit.mua):0;const amt=calcAmount(w.net,pMoney(getV('mua-price')));setV('mua-adv',mfmt(Math.min(left,amt)));LIVE['f-mua']();};
function saveTrade(k,print,opt){const c=T[k];const date=getV(k+'-date');if(!date)return fail('Vui lòng chọn ngày.');
 const name=trim(getV(k+'-cust'));if(!name)return fail('Vui lòng nhập hoặc chọn '+c.who.toLowerCase()+'.');
 const w=readW(k);if(!checkW(w,'KL tịnh'))return false;if(opt&&opt.kg!=null){w.net=opt.kg;w.bags=[];w.gross=opt.kg;w.tareTotal=0;}
 const price=pMoney(getV(k+'-price'));if(price<=0)return fail('Vui lòng nhập đơn giá lớn hơn 0.');
 const amount=calcAmount(w.net,price);const paid=pMoney(getV(k+'-paid'));if(paid<0)return fail('Số tiền đã '+(k==='mua'?'trả':'thu')+' không được âm.');
 const adv=k==='mua'?pMoney(getV('mua-adv')):0;if(adv<0)return fail('Tiền ứng trừ không được âm.');
 if(paid+adv>amount)return fail('Số tiền đã '+(k==='mua'?'trả':'thu')+(adv?' + trừ ứng':'')+' ('+money(paid+adv)+') lớn hơn thành tiền ('+money(amount)+').');
 const depChk=k==='mua'&&document.getElementById('mua-dep').checked;
 const typeId=getV(k+'-type');if(!typeId)return fail('Vui lòng chọn loại cà phê.');
 const cust0=findCust(name);const eid=ui.edit[k];
 if(adv>0){const left=cust0?advLeftFor(cust0.id,eid):0;if(adv>left)return fail('Tiền ứng trừ ('+money(adv)+') lớn hơn số khách đang nợ ứng ('+money(left)+').');}
 if(depChk){const bal=cust0?depTotal(DB,typeId,null,cust0.id)+((eid&&(findRec('purchases',eid)||{}).depositSettle&&cust0.id===(findRec('purchases',eid)||{}).customerId&&typeId===(findRec('purchases',eid)||{}).typeId)?findRec('purchases',eid).kg:0):0;if(w.net>bal+0.001)return fail('Chốt '+fkg(w.net)+' nhiều hơn số đang ký gửi ('+fkg(bal)+').');const dbk=depDateBlock(cust0&&cust0.id,typeId,date);if(dbk)return fail(dbk);}
 if(k==='ban'&&typeId===DB.settings.beanTypeId&&!(opt&&opt.force)){const A=ownAvail(eid);if(w.net>A+0.001){ui.shB={print,R:w.net,A};openDlg('<h2>⚠ Nhân của đại lý chỉ còn '+fkg(A)+'</h2><p class="mut">Phần còn lại là của khách ký gửi. Bạn muốn bán '+fkg(w.net)+'.</p><div class="btns" style="flex-direction:column;align-items:stretch">'+(A>0?'<button class="btn btn-p" data-act="shbPart">Bán '+fkg(A)+'</button>':'<button class="btn" disabled>Bán 0 kg</button>')+(isStaff()?'':'<button class="btn" data-act="shbForce">Vẫn bán '+fkg(w.net)+' (chỉ chủ)</button>')+'<button class="btn" data-act="shbNo">Quay lại sửa số kg</button></div>');return false;}}
 if(!unusualOk(w.net,price,Math.max(amount,paid)))return false;
 const cust=ensureCust(name,c.grp);let r=eid&&findRec(c.arr,eid);
 if(!r){r={id:uid(),code:nextCode(c.pre,date),ts:nextTs()};DB[c.arr].push(r);}
 if(k==='mua'){r.advanceDeduct=adv;r.depositSettle=depChk;}
 Object.assign(r,{date,customerId:cust.id,typeId,bags:w.bags,kg:w.net,price,amount,paid,note:trim(getV(k+'-note'))});
 r.tareTotal=w.tareTotal;r.gross=w.gross;if(r.tare===undefined)r.tare=0;
 syncTrade(k,r);if(!save())return false;ui.edit={};setLastDate(date);toast('Đã lưu '+r.code+'.');render();if(print)printTrade(k,r.id);return true;}
SUBMIT['f-mua']=()=>saveTrade('mua',false);SUBMIT['f-ban']=()=>saveTrade('ban',false);
ACT.shbNo=()=>{ui.shB=null;closeDlg();};

ACT.saveprint=b=>{if(b.dataset.k==='doi')saveEx(true);else if(b.dataset.k==='nk')saveNK(true);else saveTrade(b.dataset.k,true);};
function printTrade(k,id){const r=findRec(T[k].arr,id);if(!r)return;const c=T[k];const rows=[['Loại cà phê',typeName(r.typeId)]];
 {const tt=tareTotalOf(r),gr=grossOf(r);if(r.bags.length||tt>0){if(r.bags.length)rows.push(['Số bao',String(r.bags.length)]);rows.push(['Tổng cả bì',fkg(gr)],['Trừ bì',fkg(tt)]);}}
 rows.push(['KL tịnh',fkg(r.kg)],['Đơn giá',money(r.price)+'/kg'],['Thành tiền',money(r.amount)],[k==='mua'?'Đã trả':'Đã thu',money(r.paid)]);
 if(r.advanceDeduct>0)rows.push(['Trừ tiền ứng',money(r.advanceDeduct)]);
 rows.push([r.depositSettle?'Đại lý còn nợ (phiếu này)':k==='mua'?'Còn nợ':'Khách còn nợ',money(r.amount-r.paid-(r.advanceDeduct||0))]);
 if(r.depositSettle){rows.unshift(['Hình thức','Chốt giá (bán) cà ký gửi']);const td=cs(r.customerId).debtBuy;if(Math.round(td)!==Math.round(r.amount-r.paid-(r.advanceDeduct||0)))rows.push(['Tổng đại lý còn nợ (hiện tại)',money(td)]);rows.push(['Ký gửi còn lại',fkg(depTotal(DB,r.typeId,null,r.customerId))]);}
 if(k==='mua'&&r.advanceDeduct>0)rows.push(['Còn nợ ứng (sau phiếu)',money(cs(r.customerId).advLeft)]);
 printDoc(r.code,receipt({title:c.doc,code:r.code,date:r.date,partyLabel:c.who,party:custName(r.customerId),bags:r.bags,tare:null,rows,note:r.note}));}
ACT.print=b=>{const k=b.dataset.k;if(k==='nk')printNK(b.dataset.id);else if(k==='mua'||k==='ban')printTrade(k,b.dataset.id);else if(k==='doi')printEx(b.dataset.id);else if(k==='tra')printTra(b.dataset.id);};

 return{file:'doi-ca',title:'Phiếu đổi cà',rows,cols:[{h:'Số phiếu',f:r=>r.code},{h:'Ngày',f:r=>fmtDate(r.date)},{h:'Khách hàng',f:r=>custName(r.customerId)},{h:'Số bao',num:1,f:r=>I(r.bags.length)},{h:'KL cà tươi (kg)',num:1,f:r=>K(r.kgFresh)},{h:'Tỷ lệ áp dụng',num:1,f:r=>P(r.ratio)},{h:'Nhân được nhận (kg)',num:1,f:r=>K(r.kgBean)},{h:'Nhân trả ngay – phiếu cũ (kg)',num:1,f:r=>K(r.paidNow)},{h:'Ghi chú',f:r=>r.note},

 foot:['Tổng cộng ('+rows.length+' phiếu)','','',I(sum(r=>r.bags.length)),K(sum(r=>r.kgFresh)),'',K(sum(r=>r.kgBean)),K(sum(r=>r.paidNow)),'','']};};

 let ratio=own>0?own:(ex&&!ex.ratioOwn?ex.ratio:DB.settings.defaultRatio);return{own:own>0?own:null,ratio};}

 if(r){setV('doi-date',r.date);setV('doi-cust',custName(r.customerId));setV('doi-own',r.ratioOwn||'');setV('doi-note',r.note);fillW('doi',{tare:r.tare,tareTotal:r.tareTotal,gross:r.gross,bags:r.bags,kg:r.kgFresh});$('#doi-title').textContent='Sửa phiếu đổi '+r.code;$('#doi-cancel').style.display='';}
 else{setV('doi-date',dfltDate());setV('doi-cust','');setV('doi-own','');setV('doi-note','');resetW('doi');$('#doi-title').textContent='Phiếu đổi cà mới';}LIVE['f-doi']();};
function saveEx(print){const date=getV('doi-date');if(!date)return fail('Vui lòng chọn ngày.');const name=trim(getV('doi-cust'));if(!name)return fail('Vui lòng nhập hoặc chọn khách hàng.');
 const w=readW('doi');if(!checkW(w,'KL cà tươi'))return false;if(!unusualOk(w.net,0,0))return false;
 const ownS=getV('doi-own').trim();if(ownS!==''&&!(pNum(ownS)>0))return fail('Tỷ lệ riêng phải là số lớn hơn 0 (hoặc để trống).');
 if(ownS!==''&&!(pNum(ownS)>=1&&pNum(ownS)<=20))return fail('Tỷ lệ đổi phải từ 1 đến 20 (kg tươi cho 1 kg nhân). Ví dụ 4,6. Hãy kiểm tra lại dấu phẩy.');
 const ri=exRatioInfo();if(!(ri.ratio>0))return fail('Chưa có tỷ lệ đổi mặc định hợp lệ, vào Cài đặt để nhập.');
 if(!(ri.ratio>=1&&ri.ratio<=20))return fail('Tỷ lệ đổi phải từ 1 đến 20 (kg tươi cho 1 kg nhân). Hãy kiểm tra lại tỷ lệ.');
 const bean=calcBean(w.net,ri.ratio);
 const eid=ui.edit.doi;let r=eid&&findRec('exchanges',eid);const c0=findCust(name);if(r&&!exGuard(r,bean,c0?c0.id:'x',date))return false;
 const cust=ensureCust(name,'Khách đổi');const isNew=!r;if(!r){r={id:uid(),code:nextCode('PD',date),ts:nextTs(),paidNow:0};DB.exchanges.push(r);}
 if(r.tare===undefined)r.tare=0;r.tareTotal=w.tareTotal;r.gross=w.gross;
 Object.assign(r,{date,customerId:cust.id,bags:w.bags,kgFresh:w.net,ratioOwn:ri.own,ratio:ri.ratio,kgBean:bean,note:trim(getV('doi-note'))});
 syncExchange(r,isNew);if(!save())return false;ui.edit={};setLastDate(date);toast('Đã lưu '+r.code+'.');render();if(print)printEx(r.id);return true;}

function printEx(id){const r=findRec('exchanges',id);if(!r)return;const tt=tareTotalOf(r),gr=grossOf(r);const rows=[].concat(r.bags.length||tt>0?(r.bags.length?[['Số bao',String(r.bags.length)]]:[]).concat([['Tổng cả bì',fkg(gr)],['Trừ bì',fkg(tt)]]):[],[['KL cà tươi tịnh',fkg(r.kgFresh)],['Tỷ lệ áp dụng',nfP.format(r.ratio)+' kg tươi / 1 kg nhân'],['Nhân được nhận',fkg(r.kgBean)]],exDeposit(r.id)?(()=>{const tot=depTotal(DB,DB.settings.beanTypeId,null,r.customerId);return[['Chuyển vào ký gửi','+ '+fkg(r.kgBean)+' nhân'],['Ký gửi trước phiếu này',fkg(r2(tot-r.kgBean))],['TỔNG KÝ GỬI HIỆN TẠI',fkg(tot)]];})():[['Nhân đã trả ngay',fkg(r.paidNow||0)],['Ký gửi hiện tại của khách',fkg(cs(r.customerId).depKg)]]);
 printDoc(r.code,receipt({title:'PHIẾU ĐỔI CÀ PHÊ',code:r.code,date:r.date,partyLabel:'Khách hàng',party:custName(r.customerId),bags:r.bags,tare:null,rows,note:r.note}));}
/* chặn sửa/xóa phiếu đổi nếu nhân ký gửi liên kết đã được chốt / trả lại quá số mới */
/* ngày trả lại / chốt giá không được sớm hơn ngày nhận ký gửi đầu tiên của khách (trả trước khi có hàng làm tồn bị thổi phồng) */
function depDateBlock(custId,typeId,date){if(!custId||!date)return'';const ls=depEngine(DB).lots.filter(l=>l.c===custId&&l.t===typeId);if(!ls.length)return'';const first=ls.map(l=>l.date).sort()[0];
 return first&&date<first?'Ngày trả / chốt ('+fmtDate(date)+') sớm hơn ngày khách gửi cà đầu tiên ('+fmtDate(first)+'). Hãy chọn ngày từ '+fmtDate(first)+' trở đi.':'';}
const depOverSum=db=>depEngine(db).allocs.reduce((s,a)=>s+a.early,0);
function exGuard(x,newKg,newCust,newDate){const dp=x&&exDeposit(x.id);if(!dp)return true;const bid=DB.settings.beanTypeId;const bal=depTotal(DB,bid,null,dp.customerId)-dp.kg;
 if(newCust&&newCust!==dp.customerId){if(bal<-0.004)return fail('Nhân của phiếu này đã được chốt giá / trả lại, không đổi sang khách khác được.');return true;}
 if(newDate&&newDate>dp.date){const db2=Object.assign({},DB,{deposits:DB.deposits.map(d=>d===dp?Object.assign({},d,{date:newDate}):d)});if(depOverSum(db2)>depOverSum(DB)+0.004)return fail('Khách đã lấy lại / chốt giá nhân từ phiếu này trước ngày '+fmtDate(newDate)+', nên không dời ngày phiếu đổi muộn như vậy được. Hãy sửa phiếu trả / chốt trước.');}
 if(bal+(newKg||0)<-0.004)return fail('Khách đã chốt giá / lấy lại '+fkg(-bal)+' nhân từ phiếu này, không thể giảm xuống '+fkg(newKg||0)+'.');return true;}
DEL.doi=id=>{const x=findRec('exchanges',id);if(x&&!exGuard(x,0))return false;const b=DB.beanPayments.find(b=>b.exchangeId===id);if(b)removeLinked(b.id);DB.beanPayments=DB.beanPayments.filter(b=>b.exchangeId!==id);DB.deposits=DB.deposits.filter(d=>!(d.exchangeId===id&&d.source==='exchange'));DB.exchanges=DB.exchanges.filter(r=>r.id!==id);};

function traForm(){return'<div class="card"><h2 id="tra-title"></h2><form id="f-tra" data-live autocomplete="off"><div class="grid">'
 +'<label>Ngày<input type="date" id="tra-date"></label><label>Khách hàng'+custInput('tra-cust','Khách đổi','tra-hint')+'</label>'
 +'<label>Số kg nhân trả<input id="tra-kg" inputmode="decimal" placeholder="0"></label>'

ACT.payMoney=b=>{const c=custById(b.dataset.id);if(!c)return;closeDlg();ui.edit={};const dir=b.dataset.dir==='chi'?'chi':'thu',chi=dir==='chi',debt=pdDebt(c.id,dir);PD={custId:c.id,dir,id:null,busy:false};
 openDlg('<h2>'+(chi?'💵 Trả tiền cho đại lý':'💰 Thu tiền của khách')+'</h2><div class="card" style="margin:0 0 10px"><div><b>'+esc(custLabel(c))+'</b></div><div class="mut">'+(chi?'Đại lý đang nợ:':'Khách đang nợ:')+'</div><div class="big" style="font-size:28px;font-weight:800">'+money(debt)+'</div></div>'
 +'<div class="grid"><label>Số tiền '+(chi?'trả':'thu')+' (đ)<div class="inl"><input id="pd-amt" class="money" inputmode="numeric" value="'+esc(mfmt(debt))+'"><button type="button" class="btn" data-act="pdAll">'+(chi?'Trả hết':'Thu hết')+'</button></div></label><label>Ngày<input type="date" id="pd-date" value="'+esc(dfltDate())+'"></label><label class="span2">Ghi chú (không bắt buộc)<input id="pd-note" value="'+esc(chi?'Trả nợ tiền mua cà phê':'Thu nợ bán cà phê')+'"></label></div>'
 +'<div class="btns"><button class="btn btn-p" data-act="pdSave">✓ Lưu</button><button class="btn btn-p" data-act="pdSavePrint">✓ Lưu và In</button><button class="btn" data-act="closeDlg">Hủy</button></div>');};

function pdSave(print){const p=PD;if(!p||p.busy)return;if(moneyBad($('#pd-amt').parentNode))return;const date=getV('pd-date');if(!/^\d{4}-\d\d-\d\d$/.test(date))return fail('Vui lòng chọn ngày.');const amount=pMoney(getV('pd-amt'));if(!(amount>0))return fail('Số tiền phải lớn hơn 0.');
 if(!custById(p.custId))return fail('Không tìm thấy khách hàng.');const cur=pdDebt(p.custId,p.dir);
 if(amount>cur&&!confirm('Số tiền '+money(amount)+' lớn hơn số đang nợ '+money(cur)+'. Vẫn ghi nhận (trả dư)?'))return;
 const chi=p.dir==='chi';p.busy=true;const r={id:uid(),ts:nextTs(),phieuId:'',phieuKind:'',date,dir:p.dir,cat:chi?CAT_NO:CAT_THUNO,amount,customerId:p.custId,note:trim(getV('pd-note'))};
 r.code=nextCode(chi?'PC':'PT',date);r.debtBefore=debtAsOf(r).before;DB.cash.push(r);
 if(!save()){DB.cash=DB.cash.filter(x=>x!==r);p.busy=false;return;}
 p.id=r.id;setLastDate(date);render();if(print){closeDlg();printDebt(r.id,pdDone);}else pdDone();}

function pdDone(){const r=PD&&PD.id&&findRec('cash',PD.id);if(!r)return;openDlg('<div class="ecard" style="text-align:center"><div class="huge" style="color:var(--ok);font-size:48px">✓</div><h2>Đã lưu xong!</h2><div>Số phiếu: <b class="big">'+esc(r.code)+'</b></div></div><div class="btns"><button class="btn btn-p" data-act="pdPrint">🖨 In phiếu</button><button class="btn btn-p" data-act="pdShare">📤 Gửi Zalo</button><button class="btn" data-act="closeDlg">Đóng</button></div>');}

function depDesc(x){const nm=typeName(x.typeId);if(x.kind==='out')return'Trả lại nhân '+nm;if(x.source==='exchange'){const ex=DB.exchanges.find(e=>e.id===x.exchangeId);return'Đổi '+(ex?ex.code:'')+' → + '+fkg(x.kg)+' ký gửi';}if(x.source==='convert')return'Chuyển nhân còn nợ sang ký gửi';return'Nhận ký gửi '+nm;}
/* dòng nhân đổi theo kiểu cũ (chưa có ký gửi liên kết): chỉ tính số khi chưa chạy chuyển đổi */
function legacyDepRows(id){const done=!!DB.settings.owedToDepositDone,R=[];const linked=new Set(DB.deposits.filter(d=>d.source==='exchange').map(d=>d.exchangeId));
 DB.openings.filter(o=>o.kind==='beanOwed'&&o.customerId===id).forEach(o=>R.push({date:o.date,ts:-1,code:'Đầu kỳ',desc:'Số dư đầu kỳ – nhân khách ký gửi (đổi chưa lấy)'+(done?' (đã chuyển)':''),d:done?0:o.kg}));
 DB.exchanges.filter(x=>x.customerId===id&&!linked.has(x.id)).forEach(x=>R.push({date:x.date,ts:x.ts,code:x.code,desc:'Đổi '+fkg(x.kgFresh)+' tươi → + '+fkg(x.kgBean)+' nhân'+(done?' (đã chuyển)':''),d:done?0:x.kgBean}));
 DB.beanPayments.filter(x=>x.customerId===id).forEach(x=>R.push({date:x.date,ts:x.ts,code:x.code||'',desc:(x.exchangeId?'Trả nhân ngay khi đổi':x.mode==='cash'?'Quy ra tiền':'Trả nhân')+(x.mode==='cash'&&x.amount?' ('+money(x.amount)+')':''),d:done?0:-x.kg}));
 if(done){const lo=legacyOwedMap(DB)[id]||0;if(lo>0)R.push({date:today(),ts:1e15,code:'',desc:'Nhân đổi cũ chưa chuyển sang ký gửi',d:lo});}
 return R;}
function ledger(id){const m=[],b=[],a=[],dp=[],om=[],ob=[],oa=[],od=[];
 (DB.openings||[]).filter(o=>o.customerId===id).forEach(o=>{const ds=o.date;
  if(o.kind==='supplierDebt')om.push({date:ds,ts:-1,code:'Đầu kỳ',desc:'Số dư đầu kỳ – ta nợ khách',d:o.amount});else if(o.kind==='customerDebt')om.push({date:ds,ts:-1,code:'Đầu kỳ',desc:'Số dư đầu kỳ – khách nợ ta',d:-o.amount});
  else if(o.kind==='beanOwed'){}else if(o.kind==='advance')oa.push({date:ds,ts:-1,code:'Đầu kỳ',desc:'Số dư đầu kỳ – nợ ứng',d:o.amount});
  else if(o.kind==='deposit')od.push({date:ds,ts:-1,code:'Đầu kỳ',desc:'Số dư đầu kỳ – cà ký gửi '+typeName(o.typeId||DB.settings.beanTypeId),d:o.kg});});
 DB.advances.filter(x=>x.customerId===id).forEach(x=>a.push({date:x.date,ts:x.ts,code:x.code,desc:'Ứng '+(x.kind==='goods'?'hàng: '+(x.item||''):'tiền mặt'),d:x.amount}));
 DB.deposits.filter(x=>x.customerId===id).forEach(x=>dp.push({date:x.date,ts:x.ts,code:x.code,desc:depDesc(x),d:x.kind==='out'?-x.kg:x.kg}));
 legacyDepRows(id).forEach(x=>dp.push(x));
 DB.purchases.filter(p=>p.customerId===id).forEach(p=>{m.push({date:p.date,ts:p.ts,code:p.code,desc:'Mua '+typeName(p.typeId)+' '+fkg(p.kg)+' × '+fnum(p.price),d:p.amount});if(p.paid>0)m.push({date:p.date,ts:p.ts+0.5,code:p.code,desc:'Đã trả ngay',d:-p.paid});if(p.advanceDeduct>0){m.push({date:p.date,ts:p.ts+0.6,code:p.code,desc:'Trừ tiền ứng',d:-p.advanceDeduct});a.push({date:p.date,ts:p.ts,code:p.code,desc:'Trừ tiền ứng khi mua',d:-p.advanceDeduct});}if(p.depositSettle)dp.push({date:p.date,ts:p.ts,code:p.code,desc:'Chốt giá '+typeName(p.typeId),d:-p.kg});});
 DB.sales.filter(p=>p.customerId===id).forEach(p=>{m.push({date:p.date,ts:p.ts,code:p.code,desc:'Bán '+typeName(p.typeId)+' '+fkg(p.kg)+' × '+fnum(p.price),d:-p.amount});if(p.paid>0)m.push({date:p.date,ts:p.ts+0.5,code:p.code,desc:'Đã thu ngay',d:p.paid});});
 DB.cash.filter(e=>!e.phieuId&&e.customerId===id).forEach(e=>{if(e.dir==='chi'&&(e.cat===CAT_NO||e.cat===CAT_MUA))m.push({date:e.date,ts:e.ts,code:'Sổ quỹ',desc:e.cat+(e.note?' - '+e.note:''),d:-e.amount});else if(e.dir==='thu'&&e.cat===CAT_THUNO)m.push({date:e.date,ts:e.ts,code:'Sổ quỹ',desc:e.cat+(e.note?' - '+e.note:''),d:e.amount});else if(e.dir==='thu'&&e.cat===CAT_THUUNG)a.push({date:e.date,ts:e.ts,code:'Sổ quỹ',desc:'Thu hồi ứng'+(e.note?' - '+e.note:''),d:-e.amount});});
 const run=(arr,op)=>{arr.sort(cmpDate);const all=op.concat(arr);let t=0;all.forEach(r=>{t=r2(t+r.d);r.bal=t;});return all;};
 return{m:run(m,om),b:run(b,ob),a:run(a,oa),dp:run(dp,od)};}

 const c=custById(eid);if(!c)return fail('Không tìm thấy khách.');

 if(chg){if(!/^[A-Z0-9]+(-[A-Z0-9]+)*$/.test(cc))return fail('Mã khách chỉ gồm chữ A-Z, số 0-9 và dấu gạch ngang (ví dụ VAN-HOA).');if(codeTaken(cc,c.id))return fail('Mã "'+cc+'" đã có khách khác dùng.');}
 const apply=()=>{Object.assign(c,fields,{name:n});if(chg)c.code=cc;if(!save())return false;ui.edit={};toast('Đã lưu khách hàng.');render();};

SPEC.bc_ngay=()=>{const m=ui.f.bc.month||today().slice(0,7);const[y,mo]=m.split('-').map(Number);const nd=new Date(y,mo,0).getDate();const days=[];for(let d=1;d<=nd;d++)days.push(m+'-'+pad(d));
 let cum=0;const mua=days.map(d=>{const ps=DB.purchases.filter(r=>r.date===d);const kg=ps.reduce((s,r)=>s+r.kg,0),amt=ps.reduce((s,r)=>s+r.amount,0),paid=ps.reduce((s,r)=>s+r.paid,0);cum+=kg;
  return{d,n:ps.length,kg,by:visTypes().map(t=>ps.filter(r=>r.typeId===t.id).reduce((s,r)=>s+r.kg,0)),amt,paid,cum};});
 const sm=f=>mua.reduce((s,r)=>s+f(r),0);const tk=sm(r=>r.kg),ta=sm(r=>r.amount);
 const sec1={title:'Thu mua theo ngày – tháng '+pad(mo)+'/'+y,rows:mua,cols:[{h:'Ngày',f:r=>fmtDate(r.d)},{h:'Số lượt mua',num:1,f:r=>I(r.n)},{h:'KL cân (kg)',num:1,f:r=>K(r.kg)}].concat(visTypes().map((t,i)=>({h:'KL '+t.name.replace(/^Cà phê /,'')+' (kg)',num:1,f:r=>K(r.by[i])}))).concat([{h:'Thành tiền (đ)',num:1,f:r=>M(r.amt)},{h:'Giá bình quân (đ/kg)',num:1,f:r=>M(r.kg?r.amt/r.kg:0)},{h:'Đã trả (đ)',num:1,f:r=>M(r.paid)},{h:'Còn nợ (đ)',num:1,f:r=>M(r.amt-r.paid)},{h:'KL lũy kế (kg)',num:1,f:r=>K(r.cum)}]),
  foot:['Tổng cộng',I(sm(r=>r.n)),K(tk)].concat(visTypes().map((t,i)=>K(sm(r=>r.by[i])))).concat([M(ta),M(tk?ta/tk:0),M(sm(r=>r.paid)),M(ta-sm(r=>r.paid)),K(tk)])};
 let cf=0;const doi=days.map(d=>{const xs=DB.exchanges.filter(r=>r.date===d);const fr=xs.reduce((s,r)=>s+r.kgFresh,0),due=xs.reduce((s,r)=>s+r.kgBean,0);const pd=DB.beanPayments.filter(r=>r.date===d).reduce((s,r)=>s+r.kg,0);cf+=fr;return{d,n:xs.length,fr,due,pd,cf};});
 const sd=f=>doi.reduce((s,r)=>s+f(r),0);
 const sec2={title:'Đổi cà theo ngày – tháng '+pad(mo)+'/'+y,rows:doi,cols:[{h:'Ngày',f:r=>fmtDate(r.d)},{h:'Số lượt đổi',num:1,f:r=>I(r.n)},{h:'Cà tươi nhận (kg)',num:1,f:r=>K(r.fr)},{h:'Nhân phải trả (kg)',num:1,f:r=>K(r.due)},{h:'Nhân đã trả trong ngày (kg)',num:1,f:r=>K(r.pd)},{h:'Cà tươi lũy kế (kg)',num:1,f:r=>K(r.cf)}],
  foot:['Tổng cộng',I(sd(r=>r.n)),K(sd(r=>r.fr)),K(sd(r=>r.due)),K(sd(r=>r.pd)),K(sd(r=>r.fr))]};
 return{file:'bao-cao-thang-'+m,sections:[sec1,sec2]};};
SPEC.bc_khoang=()=>{const f=ui.f.bc;const inR=r=>inRange(r.date,f);const ca=DB.cash.filter(inR),ps=DB.purchases.filter(inR),ss=DB.sales.filter(inR),xs=DB.exchanges.filter(inR),bp=DB.beanPayments.filter(inR);
 const sm=(a,fn)=>a.reduce((s,r)=>s+fn(r),0);
 const catTbl=(title,dir,cats)=>{const rows=cats.map(c=>({c,v:sm(ca.filter(e=>e.dir===dir&&catCanon(e.cat)===c),e=>e.amount)})).filter(r=>r.v>0);return{title,rows,cols:[{h:'Danh mục',f:r=>r.c},{h:'Số tiền (đ)',num:1,f:r=>M(r.v)}],foot:['Tổng',M(sm(rows,r=>r.v))]};};
 const buyAvg=tid=>{let a=ps.filter(r=>r.typeId===tid);if(!a.length)a=DB.purchases.filter(r=>r.typeId===tid);const kg=sm(a,r=>r.kg);return kg?sm(a,r=>r.amount)/kg:0;};
 const mt=DB.types.map(t=>{const a=ps.filter(r=>r.typeId===t.id);return{t,n:a.length,kg:sm(a,r=>r.kg),amt:sm(a,r=>r.amount)};}).filter(r=>r.n);
 const st=DB.types.map(t=>{const a=ss.filter(r=>r.typeId===t.id);const kg=sm(a,r=>r.kg),amt=sm(a,r=>r.amount),avg=buyAvg(t.id);return{t,n:a.length,kg,amt,avg,cost:Math.round(kg*avg)};}).filter(r=>r.n);
 const rev=sm(st,r=>r.amt),cost=sm(st,r=>r.cost),gross=rev-cost;const opex=sm(ca.filter(e=>e.dir==='chi'&&!NON_OPEX.includes(catCanon(e.cat))),e=>e.amount);
 const fill=r=>r;
 return{file:'bao-cao-khoang-ngay',sections:[catTbl('Thu theo danh mục','thu',THU_CATS),catTbl('Chi theo danh mục','chi',CHI_CATS),

  {title:'Đổi cà',rows:[{n:xs.length,fr:sm(xs,r=>r.kgFresh),due:sm(xs,r=>r.kgBean),pd:sm(bp,r=>r.kg)}],cols:[{h:'Số lượt đổi',num:1,f:r=>I(r.n)},{h:'Cà tươi nhận (kg)',num:1,f:r=>K(r.fr)},{h:'Nhân phải trả (kg)',num:1,f:r=>K(r.due)},{h:'Nhân đã trả (kg)',num:1,f:r=>K(r.pd)}]},

/* ===== PROFIT ENGINE (pure functions: nhập kho, kiểm kê, lãi theo kỳ) ===== */
const sumBy=(a,f)=>a.reduce((s,r)=>s+(Number(f(r))||0),0);
const monthLabel=ym=>ym.slice(5)+'/'+ym.slice(0,4);
function lastDayOfMonth(iso){const y=Number(iso.slice(0,4)),m=Number(iso.slice(5,7));return iso.slice(0,8)+pad(new Date(y,m,0).getDate());}
/* tồn nhân xô theo sổ = Σ nhập kho − Σ bán nhân − Σ trả nhân (bằng nhân) ± điều chỉnh */
function beanBook(db,asOf){const bid=db.settings.beanTypeId;const ok=r=>!asOf||r.date<=asOf;
 const onC=depEngine(db).allocs.reduce((s,a)=>s+(a.t===bid&&ok(a)?a.on+a.over:0),0);
 return -onC+sumBy((db.openings||[]).filter(o=>o.kind==='beanStock'&&ok(o)),o=>o.kg)+sumBy((db.stockIns||[]).filter(ok),r=>r.kg)+sumBy(db.purchases.filter(r=>r.typeId===bid&&ok(r)),r=>r.kg)-sumBy(db.sales.filter(r=>r.typeId===bid&&ok(r)),r=>r.kg)-sumBy(db.beanPayments.filter(r=>r.mode==='bean'&&ok(r)),r=>r.kg)+sumBy((db.adjustments||[]).filter(r=>r.kind!=='convert'&&r.typeId===bid&&ok(r)),r=>r.kg);}
/* ===== KÝ GỬI: phần ĐÃ nằm trong sổ nhân (on-book: nhân đổi chưa lấy, nhân chuyển từ nợ cũ) / NGOÀI sổ (off-book: khách tự gửi cân vào) ===== */
function legacyOwedMap(db){const m={},linked={};const add=(c,v)=>{if(c)m[c]=(m[c]||0)+v;};
 (db.openings||[]).forEach(o=>{if(o.kind==='beanOwed')add(o.customerId,Number(o.kg)||0);});
 (db.deposits||[]).forEach(d=>{if(d.kind==='out')return;if(d.source==='exchange'&&d.exchangeId)linked[d.exchangeId]=1;else if(d.source==='convert')add(d.customerId,-(Number(d.kg)||0));});
 (db.exchanges||[]).forEach(x=>{if(!linked[x.id])add(x.customerId,Number(x.kgBean)||0);});
 (db.beanPayments||[]).forEach(b=>add(b.customerId,-(Number(b.kg)||0)));
 for(const k in m)m[k]=Math.max(0,r2(m[k]));return m;}
/* Mỗi khách + loại cà: nhập (lô) và xuất (trả lại / chốt giá) xử lý FIFO theo ngày, tất định → mỗi lần xuất tách thành phần on-book / off-book */
function depEngine(db){const bid=db.settings.beanTypeId,LO=legacyOwedMap(db),G={};
 const grp=(c,t)=>{const k=c+'|'+t;return G[k]||(G[k]={c,t,ins:[],outs:[]});};
 (db.openings||[]).forEach(o=>{if(o.kind==='deposit'&&o.customerId)grp(o.customerId,o.typeId||bid).ins.push({on:false,date:'',ts:-1,kg:Number(o.kg)||0});});
 for(const c in LO)if(LO[c]>0)grp(c,bid).ins.push({on:true,date:'',ts:-2,kg:LO[c]});
 const isOrph=depOrphanSet(db);
 (db.deposits||[]).forEach(d=>{if(isOrph(d))return;const g=grp(d.customerId,d.typeId),kg=Number(d.kg)||0;
  if(d.kind==='out')g.outs.push({kind:'out',id:d.id,date:d.date,ts:d.ts||0,kg});
  else g.ins.push({on:d.typeId===bid&&(d.source==='exchange'||d.source==='convert'),date:d.source==='convert'?'':d.date,ts:d.ts||0,kg});});
 (db.purchases||[]).forEach(p=>{if(p.depositSettle)grp(p.customerId,p.typeId).outs.push({kind:'settle',id:p.id,date:p.date,ts:p.ts||0,kg:Number(p.kg)||0});});
 const allocs=[],lots=[];
 for(const k in G){const late=[];const g=G[k],ev=[];g.ins.forEach(l=>{l.rem=l.kg;ev.push({t:0,date:l.date,ts:l.ts,l});});g.outs.forEach(o=>ev.push({t:1,date:o.date,ts:o.ts,o}));
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t-b.t)||(a.ts-b.ts));const arr=[];

/* ===== BIỂU ĐỒ: Lãi theo tháng, Tỷ lệ tươi/nhân ===== */
function drawLai(el,year){const per=computePeriods(DB);const vals=[];for(let i=1;i<=12;i++){const ym=year+'-'+pad(i);const s=monthSummary(DB,per,ym);vals.push({i,ym,s,v:s.status==='ok'?s.agg.profit:null});}
 const nums=vals.filter(x=>x.v!=null).map(x=>x.v);const hi=Math.max(0,...nums),lo0=Math.min(0,...nums);const rs=niceScale(Math.max(1e6,hi-lo0)).step;const lo=Math.floor(lo0/rs)*rs;const nI=Math.max(4,Math.ceil((hi-lo)/rs-1e-9));
 const cw=Math.max(el.clientWidth||320,280),padL=54,padR=10,padT=24,padB=28,H=290,W=Math.max(cw,padL+padR+12*28),iw=W-padL-padR,ih=H-padT-padB,slot=iw/12,bw=Math.min(slot*.6,46);
 const ry=v=>padT+ih-ih*(v-lo)/(rs*nI);const y0=ry(0);
 let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lãi theo tháng">';
 for(let i=0;i<=nI;i++){const y=padT+ih-ih*i/nI;s+='<line class="cg" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'"/><text class="ct" x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end">'+abbr(lo+rs*i)+'</text>';}
 s+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y0+'" y2="'+y0+'" style="stroke:var(--muted)"/>';
 vals.forEach(x=>{const cx=padL+slot*(x.i-1)+slot/2;
  if(x.v!=null){const yv=ry(x.v),top=Math.min(yv,y0),h=Math.max(Math.abs(yv-y0),1);s+='<g><title>Tháng '+x.i+': lãi '+money(x.v)+'</title><rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="2" style="fill:'+(x.v>=0?'var(--ok)':'var(--bad)')+'"/><text class="cv" x="'+cx+'" y="'+(x.v>=0?top-4:top+h+12)+'" text-anchor="middle">'+abbr(x.v)+'</text></g>';}
  else if(x.s.status==='wait'){const h=Math.min(ih*.22,46);s+='<g><title>Tháng '+x.i+': chờ kiểm kê</title><rect x="'+(cx-bw/2)+'" y="'+(y0-h)+'" width="'+bw+'" height="'+h+'" rx="2" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="ct" x="'+cx+'" y="'+(y0-h-4)+'" text-anchor="middle">Chờ</text></g>';}

/* ---------- SHA-256 ---------- */
function sha256js(str){const b=unescape(encodeURIComponent(str));const ml=b.length;const pr=[];for(let n=2;pr.length<64;n++){let ok=true;for(let i=0;i<pr.length;i++)if(n%pr[i]===0){ok=false;break;}if(ok)pr.push(n);}

 const by=[];for(let i=0;i<ml;i++)by.push(b.charCodeAt(i));by.push(0x80);while(by.length%64!==56)by.push(0);
 const hi=Math.floor(ml*8/4294967296),lo=(ml*8)>>>0;for(let i=3;i>=0;i--)by.push((hi>>>(i*8))&255);for(let i=3;i>=0;i--)by.push((lo>>>(i*8))&255);
 const rr=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<by.length;o+=64){const W=new Array(64);for(let i=0;i<16;i++)W[i]=(by[o+i*4]<<24)|(by[o+i*4+1]<<16)|(by[o+i*4+2]<<8)|by[o+i*4+3];
  for(let i=16;i<64;i++){const s0=rr(W[i-15],7)^rr(W[i-15],18)^(W[i-15]>>>3),s1=rr(W[i-2],17)^rr(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0;}
  let a=H[0],b2=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;}
  H=[(H[0]+a)|0,(H[1]+b2)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');}
async function sha256Hex(s){try{if(window.crypto&&crypto.subtle&&window.TextEncoder){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}return sha256js(s);}
async function makePinHash(pin){const salt=uid()+Math.random().toString(36).slice(2,8);return salt+':'+await sha256Hex(salt+':'+pin);}

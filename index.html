function auditLabel(k,r){if(r.code)return r.code;if(k==='cash')return'Sổ quỹ '+fmtDate(r.date).slice(0,5)+' – '+fnum(r.amount)+' đ';if(k==='customers')return'Khách '+(r.name||'');if(k==='types')return'Loại '+(r.name||'');if(k==='stocktakes')return'Kiểm kê '+fmtDate(r.date);if(k==='adjustments')return'Điều chỉnh kho '+fmtDate(r.date);if(k==='openings')return'Số dư đầu kỳ – '+(OPK[r.kind]?OPK[r.kind].t:r.kind);if(k==='cashCounts')return'Chốt quỹ '+fmtDate(r.date);return AUD_NAME[k]||k;}
const audEmpty=v=>v===undefined||v===null||v===''||v===false||v===0||(Array.isArray(v)&&!v.length);
function auditSkip(k,r){return!!(r.phieuId||(k==='beanPayments'&&r.exchangeId)||(k==='deposits'&&(r.source==='exchange'||r.source==='convert')));}
function snapshotOf(o){const s={};for(const f in o){if(AUD_SKIP.has(f)||audEmpty(o[f]))continue;s[f]=o[f];}return s;}
Store.audit=function(st,now,by){const alive={};
 for(const k of AUD_COLL){const arr=st[k]||[];for(const r of arr){if(!r.id)continue;const key=k+':'+r.id;alive[key]=1;const old=Store.snap[key];if(old===undefined)continue;if(old===Store.key(r))continue;if(auditSkip(k,r))continue;let o;try{o=JSON.parse(old);}catch(e){continue;}
   const ch=[];const fs=new Set(Object.keys(o).concat(Object.keys(r)));fs.forEach(f=>{if(AUD_SKIP.has(f))return;const a=o[f],b=r[f];if(audEmpty(a)&&audEmpty(b))return;if(JSON.stringify(a)===JSON.stringify(b))return;ch.push({field:f,from:a===undefined?'':a,to:b===undefined?'':b});});
   if(ch.length)st.auditLog.push({id:uid(),at:now,by,coll:k,recId:r.id,action:'update',label:auditLabel(k,r),changes:ch});}}
 for(const key in Store.snap){if(alive[key])continue;const i=key.indexOf(':'),k=key.slice(0,i);if(AUD_COLL.indexOf(k)<0)continue;let o;try{o=JSON.parse(Store.snap[key]);}catch(e){continue;}if(auditSkip(k,o))continue;
  st.auditLog.push({id:uid(),at:now,by,coll:k,recId:o.id,action:'delete',label:auditLabel(k,o),changes:[],snapshot:snapshotOf(o)});}};
function audVal(f,v){if(v===''||v===undefined||v===null)return'(trống)';if(f==='customerId')return custName(v);if(f==='typeId'||f==='toTypeId')return typeName(v);if(f==='date')return fmtDate(v);if(Array.isArray(v))return v.map(x=>nfK.format(x)).join(' ')||'(trống)';if(typeof v==='boolean')return v?'Có':'Không';
 if(f==='dir')return v==='thu'?'Thu':'Chi';if(f==='mode')return v==='cash'?'Quy ra tiền':v==='bean'?'Trả bằng nhân':v;if(f==='method')return methodName(v);if(f==='kind')return({cash:'Tiền mặt',goods:'Hàng hóa','in':'Nhận ký gửi','out':'Trả lại cà',month:'Kiểm kê tháng',close:'Chốt kho'})[v]||(OPK[v]?OPK[v].t:v);
 if(typeof v==='number')return AUD_MONEY.has(f)?fnum(v)+' đ':nfK.format(v);return String(v);}
function audChanges(r){if(r.action==='pin')return r.label||'';if(r.action==='delete'){const s=r.snapshot||{};return'Đã xóa: '+Object.keys(s).map(f=>(AUD_FIELD[f]||f)+' = '+audVal(f,s[f])).join('; ');}
 return(r.changes||[]).map(c=>(AUD_FIELD[c.field]||c.field)+': '+audVal(c.field,c.from)+' → '+audVal(c.field,c.to)).join('; ');}
const fmtAt=iso=>{if(!iso)return'';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());};

function shareText(m){const s=DB.settings;const L=[s.shopName,m.title];if(m.code)L.push('Số: '+m.code+(m.date?' – Ngày '+fmtDate(m.date):''));if(m.party)L.push((m.partyLabel||'Khách')+': '+m.party);
 (m.rows||[]).forEach(r=>L.push(r[0]+': '+r[1]));if(m.table){L.push('');m.table.rows.forEach(r=>L.push(r.join(' | ')));}(m.summary||[]).forEach(r=>L.push(r[0]+': '+r[1]));if(m.note)L.push('Ghi chú: '+m.note);return L.join('\n');}
function drawShare(ctx,m,W,logo,draw){const s=DB.settings,P=36,FF='"Be Vietnam Pro","Segoe UI",system-ui,sans-serif';let y=P;
 const F=(w,z)=>{ctx.font=w+' '+z+'px '+FF;};
 const wrap=(t,mw)=>{t=String(t==null?'':t);const out=[];t.split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(wd=>{const tt=line?line+' '+wd:wd;if(ctx.measureText(tt).width>mw&&line){out.push(line);line=wd;}else line=tt;});out.push(line);});return out;};
 const txt=(t,x,yy,al,col)=>{if(!draw)return;ctx.textAlign=al||'left';ctx.fillStyle=col||'#1c1a17';ctx.fillText(t,x,yy);};
 const line=yy=>{if(!draw)return;ctx.strokeStyle='#bdb8ae';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P,yy);ctx.lineTo(W-P,yy);ctx.stroke();};
 const para=(t,w,z,x,al,col,lh)=>{F(w,z);const ls=wrap(t,W-P*2-(x-P));ls.forEach(l=>{y+=lh||z*1.35;txt(l,al==='center'?W/2:x,y,al,col);});};
 if(draw){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,1e5);ctx.textBaseline='alphabetic';}
 if(logo&&draw)ctx.drawImage(logo,P,y,72,72);
 F('700',28);txt(String(s.shopName||''),P+(logo?88:0),y+34,'left');F('400',17);txt(String([s.address,s.phone?'ĐT: '+s.phone:''].filter(Boolean).join(' – ')),P+(logo?88:0),y+62,'left','#5b5852');y+=84;line(y);y+=10;
 para(m.title,'700',30,P,'center','#1c1a17',40);y+=6;
 if(m.code||m.date){F('400',20);y+=28;txt((m.code?'Số: '+m.code+'     ':'')+(m.date?'Ngày: '+fmtDate(m.date):''),W/2,y,'center','#3a372f');}
 if(m.party){y+=6;para((m.partyLabel||'Khách hàng')+': '+m.party,'600',22,P,'left','#1c1a17',30);}
 if(m.period){y+=0;para(m.period,'400',18,P,'left','#3a372f',26);}
 if(m.bags&&m.bags.length){y+=4;para('Cân từng bao ('+m.bags.length+' bao): '+m.bags.map((b,i)=>(i+1)+'. '+nfK.format(b)).join('   '),'400',16,P,'left','#3a372f',22);}
 if(m.rows&&m.rows.length){y+=12;line(y);m.rows.forEach(r=>{F('400',20);const lw=Math.round((W-P*2)*0.5);const ls=wrap(r[0],lw);F('700',22);const vs=wrap(r[1],(W-P*2)-lw-10);const n=Math.max(ls.length,vs.length);const top=y;
  for(let i=0;i<n;i++){const yy=top+8+(i+1)*28;if(ls[i]!==undefined){F('400',20);txt(ls[i],P,yy,'left','#3a372f');}if(vs[i]!==undefined){F('700',22);txt(vs[i],W-P,yy,'right');}}
  y=top+n*28+14;line(y);});}
 if(m.table){y+=14;const tw=W-P*2;const cols=m.table.cols;const x0=[];let ax=P;cols.forEach(c=>{x0.push(ax);ax+=tw*c.w;});
  F('700',14);if(draw){ctx.fillStyle='#eee9de';ctx.fillRect(P,y,tw,30);}
  cols.forEach((c,i)=>{txt(c.h,c.num?x0[i]+tw*c.w-6:x0[i]+6,y+20,c.num?'right':'left','#1c1a17');});y+=30;
  m.table.rows.forEach((r,ri)=>{let n=1;const cells=r.map((v,i)=>{F(m.table.bold&&m.table.bold[ri]?'700':'400',14);const ls=wrap(v,tw*cols[i].w-12);n=Math.max(n,ls.length);return ls;});
   if(draw&&ri%2===1){ctx.fillStyle='#f6f4ee';ctx.fillRect(P,y,tw,n*20+10);}
   cells.forEach((ls,i)=>{F(m.table.bold&&m.table.bold[ri]?'700':'400',14);ls.forEach((l,j)=>{txt(l,cols[i].num?x0[i]+tw*cols[i].w-6:x0[i]+6,y+20+j*20,cols[i].num?'right':'left');});});y+=n*20+10;if(draw){ctx.strokeStyle='#ddd8cc';ctx.beginPath();ctx.moveTo(P,y);ctx.lineTo(W-P,y);ctx.stroke();}});}
 if(m.summary&&m.summary.length){y+=16;m.summary.forEach(r=>{F('600',22);const ls=wrap(r[1],(W-P*2)*0.5);y+=36;txt(r[0],P,y,'left','#3a372f');F('800',26);txt(r[1],W-P,y,'right','#8a6a1e');});y+=6;}
 if(m.note){y+=10;para('Ghi chú: '+m.note,'400',18,P,'left','#3a372f',26);}
 y+=22;F('400',15);txt('Gửi từ Sổ Cà Phê HOAVU',W/2,y,'center','#8b877f');y+=P;return y;}
async function renderShareBlob(m,withLogo){const W=720;try{if(document.fonts){await Promise.all([document.fonts.load('400 20px "Be Vietnam Pro"','Tiếng Việt'),document.fonts.load('700 20px "Be Vietnam Pro"','Tiếng Việt')]);}}catch(e){}
 let logo=null;if(withLogo){logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=new URL('logo-128.png',location.href).href;});}
 const c0=document.createElement('canvas');const x0=c0.getContext('2d');const H=Math.ceil(drawShare(x0,m,W,null,false));const S=Math.max(0.5,Math.min(2,16000/H));
 const c=document.createElement('canvas');c.width=Math.round(W*S);c.height=Math.round(H*S);const ctx=c.getContext('2d');ctx.scale(S,S);drawShare(ctx,m,W,logo,true);
 return await new Promise((res,rej)=>{try{c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png');}catch(e){rej(e);}});}
async function shareModel(m){if(!m)return;const text=shareText(m);let blob=null;
 try{blob=await renderShareBlob(m,true);}catch(e){try{blob=await renderShareBlob(m,false);}catch(e2){blob=null;}}
 const name=String(m.file||m.code||'phieu').replace(/[^\w.-]+/g,'_')+'.png';
 if(blob){let file=null;try{file=new File([blob],name,{type:'image/png'});}catch(e){}
  if(file){try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:m.title,text});return;}}catch(e){if(e&&e.name==='AbortError')return;}}}
 try{if(navigator.share){await navigator.share({title:m.title,text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
 if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
 try{await navigator.clipboard.writeText(text);}catch(e){}
 toast('Đã lưu ảnh phiếu – mở Zalo và gửi ảnh');}

const RECON={off:false,grace:10*60*1000};

/* --- nền để tính: nhân khách còn nợ kiểu cũ (mở đầu kỳ + phiếu đổi chưa có ký gửi liên kết − nhân đã trả) --- */
function cvBasis(db){const m={},linked={};const add=(c,v)=>{if(c)m[c]=(m[c]||0)+v;};
 (db.openings||[]).forEach(o=>{if(o.kind==='beanOwed')add(o.customerId,Number(o.kg)||0);});
 (db.deposits||[]).forEach(d=>{if(d.source==='exchange'&&d.exchangeId)linked[d.exchangeId]=1;});
 (db.exchanges||[]).forEach(x=>{if(!linked[x.id])add(x.customerId,Number(x.kgBean)||0);});
 (db.beanPayments||[]).forEach(b=>add(b.customerId,-(Number(b.kg)||0)));
 for(const k in m)m[k]=Math.max(0,r2(m[k]));return m;}
/* tự dọn ký gửi mồ côi (chỉ máy chủ/chủ): ký gửi "từ phiếu đổi" mất phiếu gốc, ký gửi "chuyển từ nợ cũ" vượt số nợ gốc */
function reconcileDeposits(){if(!DB||isStaff()||Store.busy||Store.pending())return 0;const bid=DB.settings.beanTypeId;let n=0;
 const ex=new Set(DB.exchanges.map(x=>x.id)),now=Date.now();
 for(const d of DB.deposits.slice()){if(d.source==='exchange'&&d.exchangeId&&!ex.has(d.exchangeId)){const t=Date.parse(d.updatedAt||d.createdAt||'');if(!t||now-t<RECON.grace)continue;
  DB.deposits=DB.deposits.filter(x=>x!==d);n++;nfEvent(2,'orph:'+d.id,'Đã tự xóa phiếu ký gửi '+(d.code||'')+' ('+fkg(d.kg)+') của '+custName(d.customerId)+' vì phiếu đổi gốc đã bị xóa.',{t:'cust',id:d.customerId});}}
 const cvs=DB.deposits.filter(d=>d.source==='convert'&&d.kind!=='out');
 if(cvs.length){const B=cvBasis(DB);
  for(const d of cvs){const kg=Number(d.kg)||0,target=Math.max(0,B[d.customerId]||0);if(kg<=target+0.004)continue;
   const bal=Math.max(0,depTotal(DB,d.typeId||bid,null,d.customerId));const red=Math.min(kg-target,bal,kg);if(red<=0.004)continue;const nk=r2(kg-red);
   if(nk<=0.004)DB.deposits=DB.deposits.filter(x=>x!==d);else{d.kg=nk;d.gross=nk;}
   n++;nfEvent(2,'cv:'+d.id+':'+nk,(nk<=0.004?'Đã tự xóa ':'Đã tự giảm ')+'ký gửi "chuyển từ nợ cũ" của '+custName(d.customerId)+(nk<=0.004?' ('+fkg(kg)+')':' từ '+fkg(kg)+' xuống '+fkg(nk))+' vì phiếu đổi gốc đã bị xóa / đã trả nhân.',{t:'cust',id:d.customerId});}}
 if(n)cache=null;return n;}
/* mã khách: gán cho khách chưa có mã (theo thứ tự tạo) – chạy được nhiều lần */
function ensureCodes(){if(!DB||isStaff()||Store.pending())return 0;const miss=DB.customers.filter(c=>!c.code);
 if(!miss.length){if(!DB.settings.custCodesDone){DB.settings.custCodesDone=true;return 1;}return 0;}

function nfList(){if(NF.c)return NF.c;const L=[],owner=!isStaff(),now=new Date().toISOString();const add=(sev,key,text,act,at,act2)=>L.push({sev,key,text,act:act||null,act2:act2||null,at:at||now});

  (Store.getPref('nfDev')||[]).forEach(e=>add(e.sev,'dev:'+e.key,e.text,e.act,e.at));

const RENUM_COLL={PM:'purchases',PD:'exchanges',PB:'sales',TN:'beanPayments',NK:'stockIns',UT:'advances',KG:'deposits'};
function renumDup(code){const m=/^([A-Z]+)(\d\d)-(\d+)$/.exec(String(code));if(!m)return fail('Không đổi được số của '+code+' (số phiếu không đúng dạng).');
 const all=[];for(const k of Object.keys(RENUM_COLL).map(x=>RENUM_COLL[x]).concat(['cash']))DB[k].forEach(r=>{if(r.code===code)all.push(r);});
 if(all.length<2)return toast('Số phiếu này không còn bị trùng.');
 all.sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.id).localeCompare(String(b.id)));
 const used=new Set();for(const k of Object.keys(RENUM_COLL).map(x=>RENUM_COLL[x]).concat(['cash']))DB[k].forEach(r=>{if(r.code)used.add(r.code);});
 let n=0;for(const r of all.slice(1)){let c,g=0;do{c=nextCode(m[1],r.date);}while(used.has(c)&&++g<10000);used.add(c);r.code=c;n++;}
 if(!save()){load();return;}toast('Đã cấp số mới cho '+n+' phiếu (giữ nguyên phiếu tạo trước).');nfRefresh();rerenderNow();}

  case'cd':if(easy){EZ.ev='cd';EZ.sub=null;EZ.w=null;eRender(true);}else go('cd');break;

function gsFind(q){q=trim(q);if(!q)return null;const qf=fold(q),qd=qf.replace(/[^a-z0-9]/g,'').toUpperCase(),dg=q.replace(/\D/g,''),toks=qf.split(/\s+/).filter(Boolean);const cust=[];
 DB.customers.forEach(c=>{const code=codeNorm(c.code),nm=fold(c.name),ad=fold(c.address||''),ph=String(c.phone||'').replace(/\D/g,'');let sc=0;
  if(qd&&code===qd)sc=100;else if(qd&&code.startsWith(qd))sc=80;else if(qd&&code.includes(qd))sc=60;
  if(!sc&&dg.length>=3&&ph&&(ph.endsWith(dg)||(dg.length>=4&&ph.includes(dg))))sc=70;
  if(!sc&&toks.length){const hay=nm+' '+ad+' '+fold(c.code||'');if(toks.every(t=>hay.includes(t)))sc=50;}
  if(sc)cust.push({c,sc});});
 cust.sort((a,b)=>b.sc-a.sc||a.c.name.localeCompare(b.c.name,'vi'));
 const recs=[],isNum=/^\d{1,4}$/.test(q);
 for(const coll in REC_K)DB[coll].forEach(r=>{const code=r.code;if(!code||code==='KG-CV'||code==='-')return;const cn=codeNorm(code);let ok=false;
  if(isNum){const tr=(String(code).match(/(\d+)$/)||[])[1]||'';ok=!!tr&&parseInt(tr,10)===parseInt(q,10);}else if(qd.length>=3&&cn.includes(qd)&&(/[A-Z]/.test(qd)||qd.length>=5))ok=true;
  if(ok)recs.push({coll,r});});
 recs.sort((a,b)=>(a.r.date<b.r.date?1:a.r.date>b.r.date?-1:0)||((b.r.ts||0)-(a.r.ts||0)));
 return{cust:cust.slice(0,10),recs:recs.slice(0,10)};}

ACT.hubGo=b=>{const c=custById(b.dataset.id);if(!c)return;closeDlg();ui.edit={};const k=b.dataset.k;go(k);const id=k==='mua'?'mua-cust':k==='doi'?'doi-cust':'kgi-cust';setV(id,custName(c.id));const t=document.getElementById(id);if(t)t.dispatchEvent(new Event('input',{bubbles:true}));};
/* --- xem / in / Zalo / sửa / xóa một phiếu --- */
function printRec(k,id){if(k==='ug')printUG(id);else if(k==='kg')printKG(id);else if(k==='mua'||k==='ban')printTrade(k,id);else if(k==='doi')printEx(id);else if(k==='tra')printTra(id);else if(k==='nk')printNK(id);else if(k==='quy')printDebt(id);}
function recDialog(coll,id){const r=findRec(coll,id);if(!r)return fail('Không tìm thấy phiếu (có thể đã bị xóa).');const k=REC_K[coll];
 const ln=[['Số phiếu',r.code||'—'],['Ngày',fmtDate(r.date)]];if(r.customerId)ln.push(['Khách',custName(r.customerId)]);if(r.typeId)ln.push(['Loại cà',typeName(r.typeId)]);
 if(coll==='exchanges')ln.push(['Cà tươi → nhân',fkg(r.kgFresh)+' → '+fkg(r.kgBean)]);else if(r.kg!=null&&coll!=='cash')ln.push(['Khối lượng',fkg(r.kg)]);
 if(r.amount)ln.push(['Số tiền',money(r.amount)]);if((coll==='purchases'||coll==='sales')&&r.paid!=null)ln.push([coll==='sales'?'Đã thu':'Đã trả',money(r.paid)]);if(r.note)ln.push(['Ghi chú',r.note]);
 const sys=coll==='deposits'&&(r.source==='exchange'||r.source==='convert'),linked=coll==='cash'&&r.phieuId,easy=ui.mode==='easy';
 const canPrint=!sys&&!linked&&(k!=='quy'||r.code),editable=!sys&&!linked,easyEd=['mua','doi','tra','quy','nk'].includes(k),canEdit=editable&&(!easy||easyEd||!isStaff());
 openDlg('<h2>'+REC_T[coll]+' – '+esc(r.code||'')+'</h2><div class="card" style="margin:0 0 10px">'+ln.map(x=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0"><span class="mut">'+esc(x[0])+'</span><b style="text-align:right">'+esc(x[1])+'</b></div>').join('')+'</div>'
  +(sys?'<p class="mut">Phiếu ký gửi này do hệ thống tự sinh'+(r.source==='exchange'?' từ phiếu đổi.':' khi chuyển nhân nợ cũ.')+'</p>':'')
  +'<div class="btns">'+(canPrint?'<button class="btn btn-p" data-act="recPrint" data-k="'+k+'" data-id="'+id+'">🖨 In phiếu</button><button class="btn" data-act="recShare" data-k="'+k+'" data-id="'+id+'">📤 Gửi Zalo</button>':'')
  +(canEdit?'<button class="btn" data-act="recEdit" data-k="'+k+'" data-id="'+id+'">✎ Sửa</button>':'')+(editable?'<button class="btn btn-d" data-act="recDel" data-k="'+k+'" data-id="'+id+'">🗑 Xóa</button>':'')+(sys?sysDelBtn(r):'')+'<button class="btn" data-act="closeDlg">Đóng</button></div>');}
ACT.recPrint=b=>{closeDlg();printRec(b.dataset.k,b.dataset.id);};
ACT.recShare=b=>{DRY=true;DRYOUT=null;try{printRec(b.dataset.k,b.dataset.id);}catch(e){}finally{DRY=false;}const m=DRYOUT;DRYOUT=null;if(m){closeDlg();shareModel(m);}else toast('Không tạo được ảnh phiếu.',true);};
ACT.recEdit=b=>{closeDlg();const k=b.dataset.k,id=b.dataset.id,easy=ui.mode==='easy';if(easy){if(['mua','doi','tra','quy','nk'].includes(k))ACT.eEdit({dataset:{k,id}});else needOwner(()=>ACT.eEditFull({dataset:{k,id}}));}else ACT.edit({dataset:{k,id}});};
ACT.recDel=b=>{closeDlg();ACT.del({dataset:{k:b.dataset.k,id:b.dataset.id}});};
/* ===== 🧹 XÓA DỮ LIỆU THỬ (chủ) ===== */
const localDate=iso=>{const d=new Date(iso);return isNaN(d)?'':d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
/* Xóa dữ liệu thử: liệt kê từng phiếu để chọn. Phiếu có ngày trong khoảng: chọn sẵn. Phiếu ngày cũ nhưng nhập hôm nay: KHÔNG chọn sẵn. Khách mới: không chọn sẵn */
const WP_COLLS=[['purchases','Mua cà'],['exchanges','Đổi cà'],['beanPayments','Trả nhân'],['deposits','Ký gửi'],['sales','Bán ra'],['stockIns','Nhập kho'],['advances','Ứng tiền'],['cash','Thu / Chi'],['cashCounts','Chốt quỹ'],['stocktakes','Kiểm kê'],['openings','Số dư đầu kỳ']];
let WP={items:[],cust:[]};
function wipeCand(from,to){const inD=d=>!!d&&d>=from&&d<=to;const made=r=>r.createdAt?localDate(r.createdAt):'';const items=[];
 WP_COLLS.forEach(([k,nm])=>DB[k].forEach(r=>{if(k==='beanPayments'&&r.exchangeId)return;if(k==='deposits'&&(r.source==='exchange'||r.source==='convert'))return;if(k==='cash'&&r.phieuId)return;
  const byDate=inD(r.date),byMade=!byDate&&inD(made(r));if(!byDate&&!byMade)return;items.push({k,nm,id:r.id,r,old:byMade&&!!r.date});}));
 items.sort((x,y)=>(x.old-y.old)||((x.r.date||'')<(y.r.date||'')?-1:(x.r.date||'')>(y.r.date||'')?1:0)||(x.r.ts||0)-(y.r.ts||0));
 const gone=wipeGone(new Set(items.map(i=>i.k+':'+i.id)),items);const ref=wipeRef(gone);
 const cust=DB.customers.filter(c=>{const d=c.createdAt?localDate(c.createdAt):'';return inD(d)&&!ref.has(c.id);});
 return{items,cust};}
function wipeGone(chk,items){const gone=new Set();(items||WP.items).forEach(it=>{if(chk.has(it.k+':'+it.id))gone.add(it.id);});
 const exIds=new Set(DB.exchanges.filter(r=>gone.has(r.id)).map(r=>r.id));
 DB.beanPayments.forEach(b=>{if(b.exchangeId&&exIds.has(b.exchangeId))gone.add(b.id);});DB.deposits.forEach(d=>{if(d.source==='exchange'&&exIds.has(d.exchangeId))gone.add(d.id);});
 DB.cash.forEach(c=>{if(c.phieuId&&gone.has(c.phieuId))gone.add(c.id);});return gone;}
function wipeRef(gone){const ref=new Set();['purchases','exchanges','sales','beanPayments','cash','advances','deposits','openings'].forEach(k=>DB[k].forEach(r=>{if(r.customerId&&!gone.has(r.id))ref.add(r.customerId);}));return ref;}
function wipeLabel(it){const r=it.r,cu=r.customerId?custName(r.customerId):'';const am=r.amount!=null&&r.amount!==''?money(r.amount):r.counted!=null?money(r.counted):r.kg!=null?fkg(r.kg):'';
 return it.nm+(r.code?' '+r.code:'')+(r.date?' · '+fmtDate(r.date):'')+(cu?' · '+cu:'')+(am?' · '+am:'');}
function wipeChecked(){const s=new Set();$$('#wp-list input[data-wk]').forEach(i=>{if(i.checked)s.add(i.dataset.wk);});return s;}
function wipeRows(list,chk){return list.map(x=>'<label style="display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:15px;flex-direction:row"><input type="checkbox" style="width:auto;margin-top:3px;flex:none" data-wk="'+esc(x.key)+'"'+(chk?' checked':'')+'><span style="min-width:0;word-break:break-word">'+esc(x.text)+'</span></label>').join('');}
function wipeList(){const el=document.getElementById('wp-list');if(!el)return;const range=getV('wp-mode')==='range';document.getElementById('wp-dates').style.display=range?'':'none';
 const rg=wipeRange();WP=wipeCand(rg.from,rg.to);const cur=WP.items.filter(i=>!i.old),old=WP.items.filter(i=>i.old);const mp=i=>({key:i.k+':'+i.id,text:wipeLabel(i)});
 el.innerHTML=(cur.length?'<p style="margin:6px 0 2px"><b>Phiếu có ngày '+(range?'trong khoảng đã chọn':'hôm nay')+' ('+cur.length+') – chọn sẵn</b></p>'+wipeRows(cur.map(mp),true):'')
  +(old.length?'<p style="margin:10px 0 2px;color:var(--warn)"><b>phiếu ngày cũ nhập '+(range?'trong khoảng này':'hôm nay')+' ('+old.length+') – không chọn sẵn, chỉ tick nếu chắc là phiếu thử</b></p>'+wipeRows(old.map(mp),false):'')
  +(WP.cust.length?'<p style="margin:10px 0 2px"><b>Khách mới tạo, không còn phiếu nào ('+WP.cust.length+') – không chọn sẵn</b></p>'+wipeRows(WP.cust.map(c=>({key:'customers:'+c.id,text:'Khách '+custLabel(c)})),false):'')
  +(!cur.length&&!old.length&&!WP.cust.length?'<p class="mut">Không có gì để xóa trong phạm vi này.</p>':'');wipePrev();}
function wipePrev(){const n=wipeChecked().size,s=document.getElementById('wp-sum');if(s)s.innerHTML='<b>Đã chọn: '+n+' mục sẽ bị xóa.</b> <span class="mut">(phiếu thu/chi, ký gửi đi kèm phiếu đổi cũng bị xóa theo)</span>';
 const g=document.getElementById('wp-go');if(g)g.disabled=!(n>0&&trim(getV('wp-ok')).toUpperCase()==='XOA');}
function wipeRange(){if(getV('wp-mode')==='range')return{from:getV('wp-from')||'0000-01-01',to:getV('wp-to')||'9999-12-31'};const t=today();return{from:t,to:t};}
function wipeUndoBox(){const u=Store.wipeUndo();if(!u)return'';const n=Object.keys(u.items||{}).reduce((s,k)=>s+u.items[k].length,0);
 return'<div class="card" style="margin:8px 0"><div>Lần xóa gần nhất: <b>'+esc(fmtDT(u.at))+'</b> ('+n+' mục)</div><div class="btns" style="margin-top:6px"><button class="btn" data-act="wipeUndo">↩ Hoàn tác lần xóa vừa rồi</button></div></div>';}
function wipeDlg(){const t=today();openDlg('<h2>🧹 Xóa dữ liệu thử</h2><p class="mut">Xóa các phiếu nhập thử để sổ sạch. Việc xóa được đồng bộ sang các máy khác và ghi vào Lịch sử sửa/xóa. Cài đặt, PIN, người dùng, kết nối không bị đụng tới.</p>'+wipeUndoBox()
 +'<div class="grid"><label>Phạm vi<select id="wp-mode"><option value="today">Hôm nay ('+fmtDate(t)+')</option><option value="range">Từ ngày – đến ngày</option></select></label></div><div class="grid" id="wp-dates" style="display:none"><label>Từ ngày<input type="date" id="wp-from" value="'+t+'"></label><label>Đến ngày<input type="date" id="wp-to" value="'+t+'"></label></div>'
 +'<p class="mut" style="margin-bottom:2px">Tick vào những mục muốn xóa:</p><div id="wp-list" style="max-height:42vh;overflow:auto;border:1px solid var(--line,#ddd);border-radius:8px;padding:6px 10px"></div><div id="wp-sum" style="margin:8px 0"></div>'
 +'<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="wp-seq" style="width:auto"> Đặt lại số phiếu về 0001 cho các loại không còn phiếu nào trong năm</label>'
 +'<label>Gõ <b>XOA</b> để xác nhận<input id="wp-ok" autocomplete="off" placeholder="XOA"></label><div class="btns"><button class="btn btn-d" id="wp-go" data-act="wipeGo" disabled>🧹 Xóa</button><button class="btn" data-act="closeDlg">Hủy</button></div>');wipeList();}
ACT.wipeOpen=()=>needOwner(wipeDlg);
document.addEventListener('input',e=>{const id=e.target&&e.target.id;if(id&&id.indexOf('wp-')===0)wipePrev();});
document.addEventListener('change',e=>{const t=e.target;if(!t)return;if(t.id==='wp-mode'||t.id==='wp-from'||t.id==='wp-to')wipeList();else if(t.id==='wp-ok'||(t.dataset&&t.dataset.wk))wipePrev();});
ACT.wipeGo=()=>needOwner(()=>{const chk=wipeChecked();if(!chk.size||trim(getV('wp-ok')).toUpperCase()!=='XOA')return;const rg=wipeRange(),rs=document.getElementById('wp-seq').checked;
 const gone=wipeGone(chk);const ref=wipeRef(gone);let skip=0;chk.forEach(x=>{if(x.indexOf('customers:')!==0)return;const id=x.slice(10);if(ref.has(id)||!custById(id))skip++;else gone.add(id);});
 const KS=['purchases','exchanges','beanPayments','deposits','sales','stockIns','advances','cash','cashCounts','stocktakes','openings','customers'];
 const snap={at:new Date().toISOString(),by:Store.getUser()||'',seq:Object.assign({},DB.settings.seq),items:{}};let total=0;const parts=[];
 KS.forEach(k=>{const a=DB[k].filter(r=>gone.has(r.id));if(a.length){snap.items[k]=JSON.parse(JSON.stringify(a));total+=a.length;parts.push(k+' '+a.length);}});
 if(!total)return;
 if(!Store.setWipeUndo(snap))return fail('Không lưu được bản hoàn tác nên chưa xóa. Hãy sao lưu file rồi thử lại.');
 for(const k of KS)DB[k]=DB[k].filter(r=>!gone.has(r.id));
 if(rs){const seq=DB.settings.seq,codes=[];['purchases','exchanges','beanPayments','sales','stockIns','advances','deposits','cash'].forEach(k=>DB[k].forEach(r=>{if(r.code)codes.push(String(r.code));}));
  Object.keys(seq).forEach(key=>{if(/^[A-Z]{2}\d\d$/.test(key)&&seq[key]>0&&!codes.some(c=>c.indexOf(key+'-')===0))seq[key]=0;});}
 auditPush({coll:'settings',recId:'wipe',action:'delete',label:'Xóa dữ liệu thử '+(rg.from===rg.to?fmtDate(rg.from):fmtDate(rg.from)+' – '+fmtDate(rg.to))+': '+parts.join(', '),changes:[]});
 LOCK_OFF++;let ok;try{ok=save();}finally{LOCK_OFF--;}if(!ok)return;closeDlg();refreshCustList();toast('Đã xóa dữ liệu thử ('+total+' mục).'+(skip?' '+skip+' khách được giữ lại vì còn phiếu.':'')+' Có thể hoàn tác trong mục Xóa dữ liệu thử.');rerenderNow();});
ACT.wipeUndo=()=>needOwner(()=>{const u=Store.wipeUndo();if(!u)return fail('Không có lần xóa nào để hoàn tác.');
 const n=Object.keys(u.items||{}).reduce((s,k)=>s+u.items[k].length,0);if(!confirm('Khôi phục '+n+' mục đã xóa lúc '+fmtDT(u.at)+'?'))return;
 let back=0;const ids=new Set();
 for(const k in u.items){if(!Array.isArray(DB[k]))continue;u.items[k].forEach(r=>{if(!r||!r.id||DB[k].some(x=>x.id===r.id))return;DB[k].push(r);ids.add(r.id);back++;});}
 DB.deleted=(DB.deleted||[]).filter(d=>!ids.has(d.id));
 if(u.seq)Object.keys(u.seq).forEach(k=>{DB.settings.seq[k]=Math.max(DB.settings.seq[k]||0,u.seq[k]||0);});
 auditPush({coll:'settings',recId:'wipe',action:'update',label:'Hoàn tác xóa dữ liệu thử: khôi phục '+back+' mục',changes:[]});
 LOCK_OFF++;let ok;try{ok=save();}finally{LOCK_OFF--;}if(!ok)return;Store.setWipeUndo(null);closeDlg();refreshCustList();toast('Đã khôi phục '+back+' mục.');rerenderNow();});
/* ===== chuyển MỘT LẦN: nhân còn nợ khách đổi (kiểu cũ) → ký gửi. Chỉ chạy trên máy chủ/owner; id cố định cv-<khách> nên 2 máy không nhân đôi ===== */
function migrateOwedToDeposit(){if(!DB||DB.settings.owedToDepositDone||isStaff()||Store.pending())return 0;
 const LO=legacyOwedMap(DB),bid=DB.settings.beanTypeId;let n=0;
 for(const cid in LO){if(!(LO[cid]>0.004))continue;const id='cv-'+cid;if(DB.deposits.some(d=>d.id===id))continue;
  DB.deposits.push({id,code:'KG-CV',ts:nextTs(),date:today(),kind:'in',source:'convert',customerId:cid,typeId:bid,kg:LO[cid],gross:LO[cid],tareTotal:0,bags:[],note:'Chuyển nhân còn nợ sang ký gửi'});n++;}
 DB.settings.owedToDepositDone=true;save();return n;}
/* máy bị khóa: kiểm tra lại mã với máy chủ (tự động khi mở app / đồng bộ, hoặc bấm "Thử lại"). Mở lại được thì giữ nguyên dữ liệu, đồng bộ tiếp. */
Store.recheckLock=async function(manual){const cfg=Store.cfg();if(!Store.has()||Store._rc)return false;const now=Date.now();if(!manual&&now-(Store._rcAt||0)<15000)return false;Store._rc=true;Store._rcAt=now;
 try{const j=await Store.post(cfg,Object.assign({action:'whoami'},Store.auth()));
  if(j&&j.ok){Store.setPref('revoked','');Store.setPref('authFails',0);Store.err='';if(cfg.token&&j.user&&j.user.name)Store.setPref('srvUser',{name:j.user.name,role:j.user.role});gateCheck();chrome();render();toast('Mã đã được mở lại. Đang đồng bộ...');return true;}
  if(manual)gMsg('Mã vẫn đang bị khóa. Hãy báo chủ đại lý.');}
 catch(e){if(manual)gMsg(e.kind==='net'?'Không có mạng. Hãy bật mạng rồi thử lại.':'Chưa kiểm tra được. Hãy thử lại sau.');}
 finally{Store._rc=false;}return false;};
ACT.lockRetry=async()=>{gMsg('⏳ Đang kiểm tra...');if(await Store.recheckLock(true))Store.syncNow(true);};
/* ===== INIT ===== */
load();
if(normalizeDB.migrated){normalizeDB.migrated=false;save();}
if(!Store.pending())migrateTypes(); /* máy mới nối mạng: chờ tải lần đầu từ máy chủ rồi mới chạy các bước tự sửa (tránh ghi đè cài đặt trên máy chủ) */
LOCK_OFF++;try{try{if(!isStaff()){const a=ensureCodes(),b=reconcileDeposits()+reconcileLinkedCash();if(a||b)save();}}catch(e){}}finally{LOCK_OFF--;}
LOCK_OFF++;{let n=0;try{n=migrateOwedToDeposit();}finally{LOCK_OFF--;}if(n>0)setTimeout(()=>toast('Đã chuyển nhân còn nợ của '+n+' khách sang Ký gửi.'),700);}
try{Store.pruneAudit();}catch(e){}try{Store.pruneTomb();}catch(e){}
$('#userName').value=Store.getUser();
$('#userName').addEventListener('input',e=>{if(!Store.srvName())Store.setUser(trim(e.target.value));});
if(isStaff()&&ui.mode==='full'){ui.mode='easy';Store.setPref('mode','easy');}
render();checkConnectHash();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(Store.cfg().url)setTimeout(()=>Store.syncNow(false),1500);

</script>

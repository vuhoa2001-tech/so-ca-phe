body.easy dialog{max-width:min(520px,94vw)}

<header><div class="brand"><span class="logo"><img src="logo-128.png" alt="HOAVU"></span><div class="bt"><b>HOAVU</b><small>Sổ cà phê · Thu mua – Đổi cà – Thu chi</small></div></div><small id="shopname"></small><button id="syncPill" class="pill2 none" data-act="syncNow">💾 Chỉ lưu trên máy</button><button id="modeBtn" class="mbtn" data-act="toggleMode">Chế độ đầy đủ</button><button id="themeBtn" class="theme-btn" data-act="toggleTheme" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">🌙</button><label class="who">Người nhập: <input id="userName" placeholder="Tên của bạn" autocomplete="off"></label></header>

<script>
'use strict';
/* ===== CORE ===== */
const KEY='soSachCaPhe_v1';
const GROUPS=['Nông dân','Khách đổi','Công ty mua','Khác'];
const CAT_MUA='Trả tiền mua cà phê',CAT_NO='Trả nợ người bán',CAT_NHAN='Trả nhân bằng tiền',CAT_BAN='Thu tiền bán cà phê',CAT_THUNO='Thu nợ khách';
const CHI_CATS=[CAT_MUA,CAT_NO,CAT_NHAN,'Lương nhân công','Vận chuyển','Phơi sấy / xay xát','Điện nước','Thuê kho bãi','Bao bì','Chi phí khác','Rút vốn / chi cá nhân'];
const THU_CATS=[CAT_BAN,CAT_THUNO,'Góp vốn','Vay','Thu khác'];
const NON_OPEX=[CAT_MUA,CAT_NO,'Rút vốn / chi cá nhân'];
const ARR_KEYS=['types','customers','purchases','exchanges','beanPayments','sales','adjustments','cash'];

function defaults(){return{version:1,settings:{shopName:'Đại lý thu mua cà phê',address:'',phone:'',defaultTare:0.2,defaultRatio:4.6,openingCash:0,openingStock:{},beanTypeId:'nhan_xo',freshTypeId:'qua_tuoi',lastBackup:null,seq:{PM:0,PD:0,PB:0,TN:0}},
 types:[{id:'nhan_xo',name:'Cà phê nhân xô',note:'Nhân đã xát vỏ'},{id:'qua_tuoi',name:'Cà phê quả tươi',note:'Quả mới hái'},{id:'qua_kho',name:'Cà phê quả khô',note:''}],
 customers:[],purchases:[],exchanges:[],beanPayments:[],sales:[],adjustments:[],cash:[],deleted:[]};}
function normalizeDB(o){const d=defaults();const r=Object.assign({},d,o);const os=o.settings||{};
 r.settings=Object.assign({},d.settings,os);r.settings.seq=Object.assign({},d.settings.seq,os.seq||{});r.settings.openingStock=Object.assign({},os.openingStock||{});
 for(const k of ARR_KEYS){if(!Array.isArray(r[k]))r[k]=d[k];}
 if(!Array.isArray(r.deleted))r.deleted=[];
 if(!r.types.length)r.types=d.types;r.version=1;return r;}
let DB,cache=null;
/* ===== Store: the ONLY module that touches localStorage. A later step can swap it for a server backend. ===== */
const Store={
 USERKEY:'soSachCaPhe_v1_nguoiNhap',snap:{},
 getUser(){try{return localStorage.getItem(Store.USERKEY)||'';}catch(e){return'';}},
 setUser(n){try{localStorage.setItem(Store.USERKEY,n);}catch(e){}},
 load(){let st,s;try{s=localStorage.getItem(KEY);}catch(e){st=defaults();Store.rebase(st);setTimeout(()=>toast('Trình duyệt đang chặn bộ nhớ: dữ liệu sẽ KHÔNG được lưu. Hãy mở bằng Chrome/Edge bình thường (không ẩn danh).','err'),300);return st;}
  try{st=s?normalizeDB(JSON.parse(s)):defaults();}
  catch(e){try{localStorage.setItem(KEY+'_loi',localStorage.getItem(KEY));}catch(_){}st=defaults();setTimeout(()=>toast('Dữ liệu cũ bị lỗi, đã bắt đầu sổ mới (bản lỗi được giữ lại trong trình duyệt).','err'),300);}
  Store.rebase(st);return st;},
 key(r){const c=Object.assign({},r);delete c.createdAt;delete c.updatedAt;delete c.createdBy;return JSON.stringify(c);},
 rebase(st){Store.snapSet=JSON.stringify(Object.assign({},st.settings,{lastBackup:0,updatedAt:0}));Store.snap={};for(const k of ARR_KEYS)(st[k]||[]).forEach(r=>{Store.snap[k+':'+r.id]=Store.key(r);});},
 stamp(st){const now=new Date().toISOString(),by=Store.getUser()||'';const sk=JSON.stringify(Object.assign({},st.settings,{lastBackup:0,updatedAt:0}));if(Store.snapSet===undefined)Store.snapSet=sk;else if(sk!==Store.snapSet){st.settings.updatedAt=now;Store.snapSet=sk;}const alive={};if(!Array.isArray(st.deleted))st.deleted=[];
  for(const k of ARR_KEYS)st[k].forEach(r=>{const key=k+':'+r.id;alive[key]=1;const old=Store.snap[key];
   if(!r.id)r.id=uid();if(!r.createdAt){r.createdAt=now;r.createdBy=r.createdBy||by;r.updatedAt=now;}

function readW(p){const ts=getV(p+'-tare').trim();const tare=ts===''?0:pNum(ts);const pb=parseBags(getV(p+'-bags'));const man=pNum(getV(p+'-kg'));let w;
 if(p==='mua'){const has=pb.bags.length>0;const gross=r2(pb.bags.reduce((a,b)=>a+b,0));const tt=has&&isFinite(tare)?r2(tare):0;
  w=has?{n:pb.bags.length,tot:gross,tb:tt,net:r2(gross-tt)}:{n:0,tot:0,tb:0,net:isFinite(man)?r2(man):0};
  return Object.assign(w,{tare:has?tare:0,tareTotal:tt,gross:has?gross:w.net,bags:pb.bags,bad:pb.bad,manualBad:getV(p+'-kg').trim()!==''&&!isFinite(man)});}
 if(pb.bags.length)w=weigh(pb.bags,tare);else w={n:0,tot:0,tb:0,net:isFinite(man)?r2(man):0};
 return Object.assign(w,{tare:tare,bags:pb.bags,bad:pb.bad,manualBad:getV(p+'-kg').trim()!==''&&!isFinite(man)});}
function updW(p){const w=readW(p);const kg=document.getElementById(p+'-kg');kg.disabled=w.bags.length>0;if(w.bags.length)kg.value='';
 $('#'+p+'-sum').innerHTML=(w.bags.length?'<span class="chip">Số bao: <b>'+w.n+'</b></span><span class="chip">Tổng cả bì: <b>'+fkg(w.tot)+'</b></span><span class="chip">Trừ bì: <b>'+fkg(w.tb)+'</b></span>':'')
  +'<span class="chip">KL tịnh: <b>'+fkg(w.net)+'</b></span>'+(w.bad.length?'<span class="chip" style="border-color:var(--bad);color:var(--bad)">Số không hợp lệ: '+esc(w.bad.join(', '))+'</span>':'');
 return w;}
function resetW(p){setV(p+'-tare',p==='mua'?'':nfK.format(DB.settings.defaultTare));setV(p+'-bags','');setV(p+'-kg','');}
function fillW(p,r){if(p==='mua'){const tt=(r.bags&&r.bags.length)?tareTotalOf(r):0;setV(p+'-tare',tt?nfK.format(tt):'');}else setV(p+'-tare',nfK.format(r.tare==null?DB.settings.defaultTare:r.tare));setV(p+'-bags',(r.bags||[]).join(' '));setV(p+'-kg',(r.bags&&r.bags.length)?'':r.kg);}
function checkW(w,what){if(w.bad.length)return fail('Có số cân không hợp lệ: '+w.bad.join(', ')+'. Chỉ nhập số lớn hơn 0.');
 if(w.manualBad)return fail('KL tịnh nhập tay không hợp lệ.');
 if(!isFinite(w.tare)||w.tare<0)return fail('Bì phải là số không âm.');
 if(w.bags.length&&w.net<=0)return fail('Tổng cân nhỏ hơn hoặc bằng phần bì, kiểm tra lại số cân và phần trừ bì.');
 if(!(w.net>0))return fail('Vui lòng nhập số cân từng bao hoặc KL tịnh ('+what+') lớn hơn 0.');return true;}
function custHint(inputId,hintId){const c=findCust(getV(inputId));const h=document.getElementById(hintId);if(!h)return;if(!c){h.textContent=trim(getV(inputId))?'Khách mới – sẽ được tạo khi lưu.':'';return;}
 const s=cs(c.id);const p=[];if(s.debtBuy>0)p.push('ta nợ khách '+money(s.debtBuy));if(s.debtSale>0)p.push('khách nợ ta '+money(s.debtSale));if(s.beanLeft>0)p.push('nhân còn phải trả '+fkg(s.beanLeft));h.textContent=p.length?'Hiện: '+p.join(' · '):'Không có công nợ.';}
function custInput(id,group,hint){return'<div class="inl"><input id="'+id+'" list="dlCust" autocomplete="off" placeholder="Gõ hoặc chọn tên"><button type="button" class="btn" title="Thêm khách mới" data-act="quickCust" data-for="'+id+'" data-group="'+esc(group)+'">+</button></div><small id="'+hint+'"></small>';}
function typeOpts(sel,all){return(all?'<option value="">Tất cả loại</option>':'')+DB.types.map(t=>'<option value="'+esc(t.id)+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>').join('');}
function dateRange(k,extra){const f=ui.f[k];return'<div class="filters"><label>Từ ngày<input type="date" data-flt="'+k+'.from" value="'+esc(f.from)+'"></label><label>Đến ngày<input type="date" data-flt="'+k+'.to" value="'+esc(f.to)+'"></label>'+(extra||'')+'</div>';}
const inRange=(d,f)=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
const nameHas=(id,q)=>!q||fold(custName(id)).includes(fold(q));

const T={mua:{arr:'purchases',pre:'PM',who:'Người bán',grp:'Nông dân',paidL:'Đã trả ngay (đ)',paidCol:'Đã trả',full:'Trả đủ',debtL:'Còn nợ',doc:'PHIẾU THU MUA',file:'thu-mua',head:'Phiếu thu mua',typeL:'Loại cà phê'},
 ban:{arr:'sales',pre:'PB',who:'Người mua',grp:'Công ty mua',paidL:'Đã thu (đ)',paidCol:'Đã thu',full:'Thu đủ',debtL:'Khách còn nợ',doc:'PHIẾU BÁN HÀNG',file:'ban-ra',head:'Phiếu bán ra',typeL:'Loại cà phê xuất'}};

 +'<label>Ngày<input type="date" id="'+k+'-date"></label>'

 +'<label>Đơn giá (đ/kg)<input id="'+k+'-price" class="money" inputmode="numeric"></label></div>'
 +weighHTML(k,'Cân hàng')
 +'<div class="sumbox"><span>Thành tiền: <b id="'+k+'-amt">0 đ</b></span><span>'+c.debtL+': <b id="'+k+'-debt">0 đ</b></span></div>'
 +'<div class="grid"><label>'+c.paidL+'<div class="inl"><input id="'+k+'-paid" class="money" inputmode="numeric"><button type="button" class="btn" data-act="payFull" data-k="'+k+'">'+c.full+'</button></div></label><label class="span2">Ghi chú<input id="'+k+'-note"></label></div>'
 +'<div class="btns"><button class="btn btn-p" type="submit">Lưu phiếu</button><button class="btn" type="button" data-act="saveprint" data-k="'+k+'">Lưu và in phiếu</button><button class="btn" type="button" data-act="cancel" id="'+k+'-cancel" style="display:none">Hủy sửa</button></div></form></div>';}
function tradeList(k){const f=ui.f[k];return'<div class="card"><h2>Danh sách '+T[k].head.toLowerCase()+'</h2>'+dateRange(k,'<label>Loại<select data-flt="'+k+'.type">'+typeOpts(f.type,true)+'</select></label><label>Tìm tên<input data-flt="'+k+'.q" value="'+esc(f.q)+'" placeholder="Tên khách"></label><button class="btn" data-act="export" data-k="'+k+'">Xuất Excel</button>')+'<div id="list-'+k+'">'+renderTable(SPEC[k]())+'</div></div>';}
function tradeRows(k){const f=ui.f[k];return DB[T[k].arr].filter(r=>inRange(r.date,f)&&(!f.type||r.typeId===f.type)&&nameHas(r.customerId,f.q)).sort(cmpDateDesc);}
function tradeSpec(k){const c=T[k],rows=tradeRows(k);const sum=a=>rows.reduce((s,r)=>s+a(r),0);
 return{file:c.file,title:c.head+' - '+c.who,rows,cols:[{h:'Số phiếu',f:r=>r.code},{h:'Ngày',f:r=>fmtDate(r.date)},{h:c.who,f:r=>custName(r.customerId)},{h:'Loại',f:r=>typeName(r.typeId)},
  {h:'Số bao',num:1,f:r=>I(r.bags.length)},{h:'KL tịnh (kg)',num:1,f:r=>K(r.kg)},{h:'Đơn giá (đ/kg)',num:1,f:r=>M(r.price)},{h:'Thành tiền (đ)',num:1,f:r=>M(r.amount)},{h:c.paidCol+' (đ)',num:1,f:r=>M(r.paid)},{h:(k==='mua'?'Còn nợ':'Còn thiếu')+' (đ)',num:1,f:r=>M(r.amount-r.paid)},{h:'Ghi chú',f:r=>r.note},
  {h:'',x:false,c:'act',f:r=>H('<button class="btn btn-s" data-act="edit" data-k="'+k+'" data-id="'+r.id+'">Sửa</button><button class="btn btn-s" data-act="print" data-k="'+k+'" data-id="'+r.id+'">In phiếu</button><button class="btn btn-s btn-d" data-act="del" data-k="'+k+'" data-id="'+r.id+'">Xóa</button>')}],
  foot:['Tổng cộng ('+rows.length+' phiếu)','','','',I(sum(r=>r.bags.length)),K(sum(r=>r.kg)),'',M(sum(r=>r.amount)),M(sum(r=>r.paid)),M(sum(r=>r.amount-r.paid)),'','']};}
SPEC.mua=()=>tradeSpec('mua');SPEC.ban=()=>tradeSpec('ban');
VIEWS.mua=()=>tradeForm('mua')+tradeList('mua');
function resetTrade(k){setV(k+'-date',ui.lastDate||today());setV(k+'-cust','');setV(k+'-price',mfmt(lastPrice(k,DB.types[0].id)));setV(k+'-paid','');setV(k+'-note','');resetW(k);$('#'+k+'-title').textContent=T[k].head+' mới';$('#'+k+'-cancel').style.display='none';LIVE['f-'+k]();}
function fillTrade(k,r){setV(k+'-date',r.date);setV(k+'-cust',custName(r.customerId));setV(k+'-type',r.typeId);setV(k+'-price',mfmt(r.price));setV(k+'-paid',mfmt(r.paid));setV(k+'-note',r.note);fillW(k,r);
 $('#'+k+'-title').textContent='Sửa '+T[k].head.toLowerCase()+' '+r.code;$('#'+k+'-cancel').style.display='';LIVE['f-'+k]();}
function lastPrice(k,typeId){const l=DB[T[k].arr].filter(r=>r.typeId===typeId).sort(cmpDateDesc)[0];return l?l.price:0;}
function afterTrade(k){return()=>{const id=ui.edit[k];const r=id&&findRec(T[k].arr,id);if(r)fillTrade(k,r);else resetTrade(k);};}
AFTER.mua=afterTrade('mua');
function liveTrade(k){return t=>{const w=updW(k);if(t&&t.id===k+'-type'&&!pMoney(getV(k+'-price')))setV(k+'-price',mfmt(lastPrice(k,getV(k+'-type'))));
 const amt=calcAmount(w.net,pMoney(getV(k+'-price')));$('#'+k+'-amt').textContent=money(amt);$('#'+k+'-debt').textContent=money(amt-pMoney(getV(k+'-paid')));custHint(k+'-cust',k+'-hint');};}
LIVE['f-mua']=liveTrade('mua');LIVE['f-ban']=liveTrade('ban');
ACT.payFull=b=>{const k=b.dataset.k;const w=readW(k);setV(k+'-paid',mfmt(calcAmount(w.net,pMoney(getV(k+'-price')))));LIVE['f-'+k]();};
function saveTrade(k,print){const c=T[k];const date=getV(k+'-date');if(!date)return fail('Vui lòng chọn ngày.');
 const name=trim(getV(k+'-cust'));if(!name)return fail('Vui lòng nhập hoặc chọn '+c.who.toLowerCase()+'.');
 const w=readW(k);if(!checkW(w,'KL tịnh'))return false;
 const price=pMoney(getV(k+'-price'));if(price<=0)return fail('Vui lòng nhập đơn giá lớn hơn 0.');
 const amount=calcAmount(w.net,price);const paid=pMoney(getV(k+'-paid'));if(paid<0)return fail('Số tiền đã '+(k==='mua'?'trả':'thu')+' không được âm.');
 if(paid>amount)return fail('Số tiền đã '+(k==='mua'?'trả':'thu')+' ('+money(paid)+') lớn hơn thành tiền ('+money(amount)+').');
 const typeId=getV(k+'-type');if(!typeId)return fail('Vui lòng chọn loại cà phê.');
 const cust=ensureCust(name,c.grp);const eid=ui.edit[k];let r=eid&&findRec(c.arr,eid);
 if(!r){r={id:uid(),code:nextCode(c.pre),ts:nextTs()};DB[c.arr].push(r);}
 Object.assign(r,{date,customerId:cust.id,typeId,bags:w.bags,kg:w.net,price,amount,paid,note:trim(getV(k+'-note'))});
 if(k==='mua'){r.tareTotal=w.tareTotal;r.gross=w.gross;if(r.tare===undefined)r.tare=0;}else r.tare=w.tare;
 syncTrade(k,r);if(!save())return false;ui.edit={};ui.lastDate=date;toast('Đã lưu '+r.code+'.');render();if(print)printTrade(k,r.id);return true;}
SUBMIT['f-mua']=()=>saveTrade('mua',false);SUBMIT['f-ban']=()=>saveTrade('ban',false);
ACT.saveprint=b=>{if(b.dataset.k==='doi')saveEx(true);else saveTrade(b.dataset.k,true);};
function printTrade(k,id){const r=findRec(T[k].arr,id);if(!r)return;const c=T[k];const rows=[['Loại cà phê',typeName(r.typeId)]];
 if(k==='mua'){const tt=tareTotalOf(r),gr=grossOf(r);if(r.bags.length||tt>0){if(r.bags.length)rows.push(['Số bao',String(r.bags.length)]);rows.push(['Tổng cả bì',fkg(gr)],['Trừ bì',fkg(tt)]);}}
 else if(r.bags.length)rows.push(['Số bao',String(r.bags.length)],['Tổng KL cả bì',fkg(weigh(r.bags,r.tare).tot)],['Trừ bì',fkg(weigh(r.bags,r.tare).tb)]);
 rows.push(['KL tịnh',fkg(r.kg)],['Đơn giá',money(r.price)+'/kg'],['Thành tiền',money(r.amount)],[k==='mua'?'Đã trả':'Đã thu',money(r.paid)],[k==='mua'?'Còn nợ':'Khách còn nợ',money(r.amount-r.paid)]);
 printDoc(r.code,receipt({title:c.doc,code:r.code,date:r.date,partyLabel:c.who,party:custName(r.customerId),bags:r.bags,tare:k==='mua'?null:r.tare,rows,note:r.note}));}
ACT.print=b=>{const k=b.dataset.k;if(k==='mua'||k==='ban')printTrade(k,b.dataset.id);else if(k==='doi')printEx(b.dataset.id);else if(k==='tra')printTra(b.dataset.id);};
DEL.mua=id=>{removeLinked(id);DB.purchases=DB.purchases.filter(r=>r.id!==id);};

 if(r){setV('doi-date',r.date);setV('doi-cust',custName(r.customerId));setV('doi-own',r.ratioOwn||'');setV('doi-now',r.paidNow||'');setV('doi-note',r.note);fillW('doi',{tare:r.tare,bags:r.bags,kg:r.kgFresh});$('#doi-title').textContent='Sửa phiếu đổi '+r.code;$('#doi-cancel').style.display='';}

function saveEx(print){const date=getV('doi-date');if(!date)return fail('Vui lòng chọn ngày.');const name=trim(getV('doi-cust'));if(!name)return fail('Vui lòng nhập hoặc chọn khách hàng.');
 const w=readW('doi');if(!checkW(w,'KL cà tươi'))return false;
 const ownS=getV('doi-own').trim();if(ownS!==''&&!(pNum(ownS)>0))return fail('Tỷ lệ riêng phải là số lớn hơn 0 (hoặc để trống).');

 DB.beanPayments.filter(x=>x.customerId===id).forEach(x=>b.push({date:x.date,ts:x.ts,code:x.code||'',desc:(x.mode==='cash'?'Quy ra tiền ':'Trả nhân ')+(x.note?'- '+x.note:''),d:-x.kg}));

 else{if(s.indexOf(',')>=0&&s.split(',')[1].length>=2)return;s=(s==='0'?'':s)+v;if(s.length>8)return;}
 KP.s=s;kpUpdate();};

 let v=null;if(/^\d$/.test(e.key))v=e.key;else if(e.key===','||e.key==='.')v=',';else if(e.key==='Backspace')v='del';
 if(v!==null){e.preventDefault();ACT.ekey({dataset:{v}});}else if(e.key==='Enter'){const b=document.querySelector('[data-act=eAddBag],[data-act=eSubOk],[data-act=eNext]:not([disabled])');if(b){e.preventDefault();b.click();}}});

const needCust=c=>c===CAT_NO||c===CAT_THUNO;
function steps(){const w=EZ.w,d=w.d;switch(w.kind){case'mua':return['cust','type','bags'].concat(d.total!=null?[]:['tare']).concat(['price','pay','ok']);case'doi':return['cust','bags','ratio','now','ok'];case'tra':return['cust','kg','mode','ok'];default:return['dir','cat'].concat(needCust(d.cat)?['cust']:[]).concat(['amt','note','ok']);}}
function eNew(kind,pre,startStep){const d=Object.assign({date:ui.lastDate||today(),custId:'',tare:DB.settings.defaultTare,bags:[],total:null,note:''},pre||{});
 if(kind==='doi'&&!d.ratio){d.ratio=DB.settings.defaultRatio;d.ratioOwn=null;d.paidNow=null;}
 EZ.w={kind,d,step:0,eid:null,saving:false};EZ.ev='wiz';EZ.sub=null;EZ.done=null;
 if(startStep){const i=steps().indexOf(startStep);if(i>0)EZ.w.step=i;}eEnter();eRender(true);}
const INIT={bags(){KP.mode='kg';KP.s='';KP.fresh=false;EZ.editIdx=null;},tare(){const d=EZ.w.d;KP.mode='kg';KP.s=d.tareSet?kgStr(d.tareTotal||0):'';KP.fresh=!!KP.s;},price(){KP.mode='money';KP.s=String(EZ.w.d.price||'');KP.fresh=!!KP.s;},kg(){KP.mode='kg';KP.s=EZ.w.d.kg?kgStr(EZ.w.d.kg):'';KP.fresh=!!KP.s;},amt(){KP.mode='money';KP.s=EZ.w.d.amount?String(EZ.w.d.amount):'';KP.fresh=!!KP.s;}};
function eEnter(){const id=steps()[EZ.w.step];if(INIT[id])INIT[id]();}
function eNet(d){if(d.total!=null)return d.total;if(EZ.w&&EZ.w.kind==='mua')return r2(d.bags.reduce((a,b)=>a+b,0)-(d.tareTotal||0));return weigh(d.bags,d.tare).net;}
const eGross=d=>d.total!=null?d.total:r2(d.bags.reduce((a,b)=>a+b,0));
const COMMIT={
 cust(){if(!EZ.w.d.custId)return fail('Hãy chọn khách.');return true;},
 type(){if(!EZ.w.d.typeId)return fail('Hãy chọn loại cà.');return true;},
 bags(){if(KP.s!=='')return fail('Bạn còn số chưa thêm. Bấm "✓ Thêm bao" trước.');if(!((EZ.w.kind==='mua'?eGross(EZ.w.d):eNet(EZ.w.d))>0))return fail('Chưa có số cân. Hãy thêm bao.');return true;},
 tare(){const d=EZ.w.d,g=eGross(d);if(KP.s===''&&!d.tareSet)return fail('Hãy gõ số kg trừ bì, hoặc bấm "Không trừ (0 kg)".');const v=KP.s===''?(d.tareTotal||0):kpVal();if(!(v>=0))return fail('Số kg trừ bì không hợp lệ.');if(!(v<g))return fail('Trừ bì phải nhỏ hơn tổng cả bì ('+fkg(g)+'). Hãy nhập lại.');d.tareTotal=r2(v);d.tareSet=true;return true;},
 price(){const v=kpVal();if(!(v>0))return fail('Hãy nhập đơn giá.');EZ.w.d.price=v;return true;},
 pay(){if(!EZ.w.d.paidMode)return fail('Hãy chọn cách trả tiền.');return true;},
 ratio(){return true;},now(){if(EZ.w.d.paidNow==null)return fail('Hãy chọn có trả nhân ngay hay không.');return true;},
 kg(){const v=kpVal(),d=EZ.w.d;const left=eLeft();if(!(v>0))return fail('Hãy nhập số kg nhân trả.');if(v>left+0.001)return fail('Nhiều hơn số còn nợ ('+fkg(left)+'). Nhập lại.');d.kg=r2(v);return true;},
 mode(){if(!EZ.w.d.mode)return fail('Hãy chọn hình thức trả.');return true;},
 dir(){return!!EZ.w.d.dir||fail('Hãy chọn Thu hoặc Chi.');},cat(){return!!EZ.w.d.cat||fail('Hãy chọn danh mục.');},
 amt(){const v=kpVal();if(!(v>0))return fail('Hãy nhập số tiền.');EZ.w.d.amount=v;return true;},
 note(){EZ.w.d.note=trim(getV('eNote'));return true;}};
function eLeft(){const d=EZ.w.d;let l=cs(d.custId).beanLeft;if(EZ.w.eid){const o=findRec('beanPayments',EZ.w.eid);if(o&&o.customerId===d.custId)l+=o.kg;}return l;}

 let list=DB.customers.filter(c=>!f||fold(c.name+' '+c.phone).includes(f));if(tra)list=list.filter(c=>cs(c.id).beanLeft>0.004);

EBODY.ok=()=>{const w=EZ.w,d=w.d;let h='<div class="ecard">';
 if(w.kind==='mua'){const c=muaCalc(d);h+=rl('Người bán',esc(custName(d.custId)))+rl('Loại cà',esc(typeName(d.typeId)))+(d.total==null?rl('Số bao',d.bags.length)+rl('Tổng cả bì',fkg(eGross(d)))+rl('Trừ bì',fkg(d.tareTotal||0)):'')+rl('KL tịnh',fkg(c.net))+rl('Đơn giá',money(d.price))+rl('Thành tiền','<span class="big">'+money(c.amount)+'</span>')+rl('Đã trả',money(c.paid))+rl('Còn nợ','<span class="big">'+money(c.debt)+'</span>');}
 else if(w.kind==='doi'){const net=eNet(d),bean=calcBean(net,d.ratio);h+=rl('Khách',esc(custName(d.custId)))+(d.total==null?rl('Số bao',d.bags.length):'')+rl('Cà tươi nhận',fkg(net))+rl('Tỷ lệ',nfP.format(d.ratio))+rl('Phải trả nhân','<span class="big">'+fkg(bean)+'</span>')+rl('Trả ngay',fkg(d.paidNow||0))+rl('Còn phải trả','<span class="big">'+fkg(bean-(d.paidNow||0))+'</span>');}
 else if(w.kind==='tra'){h+=rl('Khách',esc(custName(d.custId)))+rl('Trả nhân','<span class="big">'+fkg(d.kg)+'</span>')+rl('Hình thức',d.mode==='cash'?'Quy ra tiền':'Trả bằng nhân')+(d.mode==='cash'?rl('Thành tiền',money(calcAmount(d.kg,d.price))):'')+rl('Còn nợ sau khi trả',fkg(r2(eLeft()-d.kg)));}
 else h+=rl(d.dir==='thu'?'THU':'CHI','<span class="big">'+money(d.amount)+'</span>')+rl('Danh mục',esc(d.cat))+(d.custId?rl('Khách',esc(custName(d.custId))):'')+(d.note?rl('Ghi chú',esc(d.note)):'');
 h+=rl('Ngày',fmtDate(d.date))+'</div>';
 return{html:h+(w.kind==='quy'?'':EB('ok2','eSavePrint','✓ Lưu và In',w.saving?'disabled':'')),nonext:true};};
ACT.eSave=()=>eSave(false);ACT.eSavePrint=()=>eSave(true);
const WRITE={
 mua(w){const d=w.d,c=muaCalc(d);if(!d.custId||!d.typeId||!(c.net>0)||!(d.price>0))throw new Error('Thiếu thông tin, hãy quay lại kiểm tra.');
  let r=w.eid&&findRec('purchases',w.eid);if(!r){r={id:uid(),code:nextCode('PM'),ts:nextTs()};DB.purchases.push(r);}
  Object.assign(r,{date:d.date,customerId:d.custId,typeId:d.typeId,bags:d.total!=null?[]:d.bags.slice(),kg:c.net,tareTotal:d.total!=null?0:r2(d.tareTotal||0),gross:eGross(d),price:d.price,amount:c.amount,paid:c.paid,note:d.note||''});
  if(r.tare===undefined)r.tare=0;syncTrade('mua',r);return save()?r:null;},
 doi(w){const d=w.d,net=eNet(d);if(!d.custId||!(net>0)||!(d.ratio>0))throw new Error('Thiếu thông tin, hãy quay lại kiểm tra.');const bean=calcBean(net,d.ratio);
  let r=w.eid&&findRec('exchanges',w.eid);if(!r){r={id:uid(),code:nextCode('PD'),ts:nextTs()};DB.exchanges.push(r);}
  Object.assign(r,{date:d.date,customerId:d.custId,tare:d.tare,bags:d.total!=null?[]:d.bags.slice(),kgFresh:net,ratioOwn:d.ratioOwn||null,ratio:d.ratio,kgBean:bean,paidNow:r2(d.paidNow||0),note:d.note||''});
  syncExchange(r);return save()?r:null;},
 tra(w){const d=w.d;if(!d.custId||!(d.kg>0)||!d.mode)throw new Error('Thiếu thông tin, hãy quay lại kiểm tra.');if(d.kg>eLeft()+0.001)throw new Error('Số trả nhiều hơn số còn nợ.');
  const amount=d.mode==='cash'?calcAmount(d.kg,d.price):0;let r=w.eid&&findRec('beanPayments',w.eid);if(!r){r={id:uid(),code:nextCode('TN'),ts:nextTs(),exchangeId:''};DB.beanPayments.push(r);}
  Object.assign(r,{date:d.date,customerId:d.custId,kg:d.kg,mode:d.mode,price:d.mode==='cash'?d.price:0,amount,note:d.note||''});syncBean(r);return save()?r:null;},
 quy(w){const d=w.d;if(!d.dir||!d.cat||!(d.amount>0))throw new Error('Thiếu thông tin, hãy quay lại kiểm tra.');if(needCust(d.cat)&&!d.custId)throw new Error('Danh mục này cần chọn khách.');
  let r=w.eid&&findRec('cash',w.eid);if(!r){r={id:uid(),ts:nextTs(),phieuId:'',phieuKind:''};DB.cash.push(r);}
  Object.assign(r,{date:d.date,dir:d.dir,cat:d.cat,amount:d.amount,customerId:d.custId||'',note:d.note||''});return save()?r:null;}};
function eSave(print){const w=EZ.w;if(!w||w.saving)return;w.saving=true;document.querySelectorAll('[data-act=eSave],[data-act=eSavePrint]').forEach(b=>b.disabled=true);let rec;
 try{rec=WRITE[w.kind](w);}catch(e){w.saving=false;eRender(false);fail(String(e.message||e));return;}
 if(!rec){w.saving=false;eRender(false);return;}
 ui.lastDate=rec.date;EZ.done={kind:w.kind,id:rec.id,custId:rec.customerId,code:rec.code||'',edited:!!w.eid};EZ.ev='done';EZ.w=null;eRender(true);if(print)ePrint(EZ.done.kind,rec.id);}
function ePrint(k,id){if(k==='mua')printTrade('mua',id);else if(k==='doi')printEx(id);else if(k==='tra')printTra(id);}
function eDone(){const x=EZ.done;return'<div class="ecard" style="text-align:center"><div class="huge" style="color:var(--ok)">✓</div><h2 class="eq">Đã lưu xong!</h2>'+(x.code?'<div>Số phiếu: <b class="big">'+esc(x.code)+'</b></div>':'')+'</div>'
 +(x.kind==='quy'?'':EB('alt','eDonePrint','🖨 In phiếu'))+(x.custId&&!x.edited&&x.kind!=='quy'?EB('go','eAgain','➕ Nhập phiếu mới cho khách này'):EB('go','eAgain','➕ Nhập phiếu mới'))+EB('ghost','eHome','Về trang chính');}
ACT.eDonePrint=()=>ePrint(EZ.done.kind,EZ.done.id);
ACT.eAgain=()=>{const x=EZ.done,k=x.kind;if(k==='quy')return eNew('quy');if(x.edited||!x.custId)return eNew(k);eNew(k,{custId:x.custId},'cust');EZ.w.step=1;eEnter();eRender(true);};

ACT.eEdit=b=>{const k=b.dataset.k,id=b.dataset.id;let r,d;
 if(k==='mua'){r=findRec('purchases',id);if(!r)return;d={date:r.date,custId:r.customerId,typeId:r.typeId,tare:r.tare==null?0:r.tare,bags:r.bags.slice(),total:r.bags.length?null:r.kg,tareTotal:tareTotalOf(r),tareSet:true,price:r.price,paidMode:r.paid>=r.amount&&r.amount>0?'full':r.paid>0?'part':'none',paid:r.paid,note:r.note};}
 else if(k==='doi'){r=findRec('exchanges',id);if(!r)return;d={date:r.date,custId:r.customerId,tare:r.tare==null?DB.settings.defaultTare:r.tare,bags:r.bags.slice(),total:r.bags.length?null:r.kgFresh,ratio:r.ratio,ratioOwn:r.ratioOwn,paidNow:r.paidNow,note:r.note};}
 else if(k==='tra'){r=findRec('beanPayments',id);if(!r)return;d={date:r.date,custId:r.customerId,kg:r.kg,mode:r.mode,price:r.price,note:r.note,tare:0,bags:[],total:null};}
 else if(k==='quy'){r=findRec('cash',id);if(!r)return;d={date:r.date,dir:r.dir,cat:r.cat,custId:r.customerId,amount:r.amount,note:r.note,tare:0,bags:[],total:null};}
 else return;
 EZ.w={kind:k,d,step:0,eid:id,saving:false};EZ.ev='wiz';EZ.sub=null;eEnter();eRender(true);};

 DB.purchases.filter(r=>r.date===dt).forEach(r=>items.push({k:'mua',r,ic:'🛒',t:'Mua cà – '+custName(r.customerId),l:[typeName(r.typeId)+' · '+fkg(r.kg),money(r.amount)+' (đã trả '+money(r.paid)+')']}));
 DB.exchanges.filter(r=>r.date===dt).forEach(r=>items.push({k:'doi',r,ic:'🔄',t:'Đổi cà – '+custName(r.customerId),l:[fkg(r.kgFresh)+' tươi → '+fkg(r.kgBean)+' nhân','Trả ngay: '+fkg(r.paidNow)]}));
 DB.beanPayments.filter(r=>r.date===dt&&!r.exchangeId).forEach(r=>items.push({k:'tra',r,ic:'🫘',t:'Trả nhân – '+custName(r.customerId),l:[fkg(r.kg)+(r.mode==='cash'?' (quy ra tiền '+money(r.amount)+')':'')]}));
 DB.sales.filter(r=>r.date===dt).forEach(r=>items.push({k:'ban',r,ic:'📦',t:'Bán – '+custName(r.customerId),l:[typeName(r.typeId)+' · '+fkg(r.kg),money(r.amount)+' (đã thu '+money(r.paid)+')']}));
 DB.cash.filter(r=>r.date===dt&&!r.phieuId).forEach(r=>items.push({k:'quy',r,ic:r.dir==='thu'?'⬇':'⬆',t:(r.dir==='thu'?'Thu – ':'Chi – ')+r.cat,l:[money(r.amount)+(r.customerId?' · '+custName(r.customerId):'')+(r.note?' · '+r.note:'')]}));
 items.sort((a,b)=>(b.r.ts||0)-(a.r.ts||0));
 return'<div class="row2">'+EB('ghost','eDay','‹ Ngày trước','data-d="-1"')+EB('ghost','eDay','Ngày sau ›','data-d="1"')+'</div><h2 class="eq" style="text-align:center">'+(dt===today()?'Hôm nay, ':'')+fmtDate(dt)+'</h2>'

function eNoDetail(){const c=custById(EZ.sel),s=cs(EZ.sel);return'<div class="ecard"><h2 class="eq">'+esc(c.name)+'</h2>'+(c.phone?'<div>☎ '+esc(c.phone)+'</div>':'')+rl('Ta còn nợ khách',money(s.debtBuy))+rl('Khách nợ ta',money(s.debtSale))+rl('Nhân còn phải trả',fkg(s.beanLeft))+'</div>'
 +(s.debtBuy>0?EB('ok','eNoPay','💵 Trả tiền','data-dir="chi"'):'')+(s.debtSale>0?EB('ok','eNoPay','💵 Thu tiền','data-dir="thu"'):'')+(s.beanLeft>0.004?EB('go','eNoBean','🫘 Trả nhân'):'')+EB('alt','detail','📜 Xem sổ chi tiết','data-id="'+c.id+'"');}
ACT.eNoPay=b=>{const s=cs(EZ.sel),chi=b.dataset.dir==='chi';eNew('quy',{dir:chi?'chi':'thu',cat:chi?CAT_NO:CAT_THUNO,custId:EZ.sel,amount:chi?s.debtBuy:s.debtSale,note:chi?'Trả nợ tiền mua cà phê':'Thu nợ bán cà phê'},'amt');};
ACT.eNoBean=()=>{eNew('tra',{custId:EZ.sel,kg:0},'kg');};

/* ----- Báo cáo ----- */
function eBc(){const td=today(),m=td.slice(0,7);let from,to,label;const pm=new Date();pm.setDate(1);pm.setMonth(pm.getMonth()-1);const pms=pm.getFullYear()+'-'+pad(pm.getMonth()+1);
 if(EZ.bcp==='today'){from=to=td;label='Hôm nay';}else if(EZ.bcp==='month'){from=m+'-01';to=m+'-31';label='Tháng '+m.slice(5)+'/'+m.slice(0,4);}else{from=pms+'-01';to=pms+'-31';label='Tháng '+pms.slice(5)+'/'+pms.slice(0,4);}
 const f=r=>r.date>=from&&r.date<=to;const sm=(a,fn)=>a.reduce((s,r)=>s+fn(r),0);const ps=DB.purchases.filter(f),xs=DB.exchanges.filter(f),ss=DB.sales.filter(f),ca=DB.cash.filter(f);
 const thu=sm(ca.filter(e=>e.dir==='thu'),e=>e.amount),chi=sm(ca.filter(e=>e.dir==='chi'),e=>e.amount);
 return'<div class="row2" style="grid-template-columns:1fr 1fr 1fr">'+[['today','Hôm nay'],['month','Tháng này'],['prev','Tháng trước']].map(p=>'<button class="eb '+(EZ.bcp===p[0]?'sel':'alt')+'" style="font-size:17px" data-act="eBcP" data-p="'+p[0]+'">'+p[1]+'</button>').join('')+'</div><h2 class="eq" style="text-align:center">'+label+'</h2>'
 +'<div class="ecard"><b>🛒 Mua cà</b>'+rl('Số lượt',ps.length)+rl('Khối lượng',fkg(sm(ps,r=>r.kg)))+rl('Thành tiền','<span class="big">'+money(sm(ps,r=>r.amount))+'</span>')+rl('Còn nợ người bán',money(sm(ps,r=>r.amount-r.paid)))+'</div>'
 +'<div class="ecard"><b>🔄 Đổi cà</b>'+rl('Số lượt',xs.length)+rl('Cà tươi nhận',fkg(sm(xs,r=>r.kgFresh)))+rl('Nhân phải trả','<span class="big">'+fkg(sm(xs,r=>r.kgBean))+'</span>')+'</div>'
 +'<div class="ecard"><b>📦 Bán ra</b>'+rl('Khối lượng',fkg(sm(ss,r=>r.kg)))+rl('Doanh thu','<span class="big">'+money(sm(ss,r=>r.amount))+'</span>')+'</div>'
 +'<div class="ecard"><b>💰 Tiền</b>'+rl('Thu',money(thu))+rl('Chi',money(chi))+rl('Tiền mặt trong quỹ (hiện tại)','<span class="big">'+money(stats().cash)+'</span>')+'</div>'
 +'<div class="ecard"><b>🏠 Tồn kho hiện tại</b>'+DB.types.map(t=>rl(esc(t.name),fkg(stats().stock[t.id]||0))).join('')+'</div>'
 +EB('alt','eBcFull','Xem báo cáo đầy đủ (chế độ đầy đủ)');}
ACT.eBcP=b=>{EZ.bcp=b.dataset.p;eRender(false);};
ACT.eBcFull=()=>{ui.mode='full';Store.setPref('mode','full');ui.tab='bc';render();};

/* ----- Cài đặt (dễ dùng) ----- */
function eCd(){const st=Store.status();return'<div class="ecard"><label>Người nhập<input id="eUser" class="einput" value="'+esc(Store.getUser())+'" autocomplete="off"></label></div>'
 +'<div class="ecard">Đồng bộ: <b>'+esc(st.t)+'</b></div>'+EB('go','syncNow','🔄 Đồng bộ ngay')+EB('alt','backup','💾 Sao lưu ra file')+EB('ghost','toggleMode','Chế độ đầy đủ (cài đặt đầy đủ, dành cho chủ)');}

/* ===== INIT ===== */
(function(){ui.mode=Store.getPref('mode')||'easy';EZ.ev=Store.getUser()?'home':'welcome';})();

/* ===== INIT ===== */
load();
$('#userName').value=Store.getUser();
$('#userName').addEventListener('input',e=>Store.setUser(trim(e.target.value)));
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(Store.cfg().url)setTimeout(()=>Store.syncNow(false),1500);

</script>
